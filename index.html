<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Coffee Shaky ☕</title>
    <meta name="description" content="בית הקפה המשפחתי של משפחת איתר. מזמינים בשתי נגיעות, מחכים פחות.">
    <meta name="theme-color" content="#17110d">

    <link rel="icon" type="image/png" href="appicon.png">
    <link rel="apple-touch-icon" href="appicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;800&family=Suez+One&display=swap" rel="stylesheet">

    <style>
        /* ---------------------------------------------------------------
           Coffee Shaky - design tokens

           Palette rationale: the drink illustrations are dark-brown line
           art, so they need a light surface to read against. Rather than
           the default coffee-brown-on-cream page (which makes the whole
           app disappear into generic warm-beige), the page shell is a
           dark roast built from coffee-bg.jpeg and the cream is demoted
           to card surfaces only. One interactive accent: pistachio.
           Brick red is reserved exclusively for destructive actions.

           Radius rule: containers 22px, inner blocks 14px, anything
           interactive is a full pill. No exceptions.
        --------------------------------------------------------------- */
        :root {
            --roast-950: #17110d;
            --roast-900: #221913;
            --roast-800: #32241b;

            --cream: #f7f0e1;
            --cream-sunk: #ece0c9;
            --cream-line: #dccbaf;

            --ink: #2c1d13;
            --ink-soft: #7a6350;

            --accent: #a8d16c;
            --accent-deep: #6f9c38;
            --accent-ink: #1e2b0e;

            --brick: #c4553c;

            --r-card: 18px;
            --r-block: 12px;

            --shadow-card: 0 1px 1px rgba(12, 7, 4, .14), 0 8px 20px -8px rgba(12, 7, 4, .42);
            --shadow-lift: 0 2px 3px rgba(12, 7, 4, .14), 0 18px 36px -12px rgba(12, 7, 4, .5);

            --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
            --ease-out: cubic-bezier(.16, 1, .3, 1);

            --font-ui: 'Rubik', 'Assistant', 'Heebo', 'Arial Hebrew', system-ui, sans-serif;
            --font-sign: 'Suez One', 'Rubik', 'Arial Hebrew', Georgia, serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Author display rules on .usual / .sheet would otherwise beat the UA
           stylesheet's [hidden] { display: none }. */
        [hidden] { display: none !important; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-ui);
            background: var(--roast-950);
            color: var(--cream);
            min-height: 100dvh;
            direction: rtl;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* Real bean texture instead of a flat fill. Fixed + pointer-events
           none so it never repaints during scroll. */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url('coffee-bg.jpeg');
            background-size: 300px;
            background-repeat: repeat;
            opacity: .06;
            filter: saturate(.3) contrast(.85) blur(2px);
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(115% 62% at 50% -8%, rgba(168, 209, 108, .10), rgba(23, 17, 13, 0) 62%);
        }

        .shell {
            position: relative;
            z-index: 1;
            max-width: 760px;
            margin: 0 auto;
            padding: 0 16px calc(28px + env(safe-area-inset-bottom));
        }

        /* ---------------- the counter (header) ---------------- */

        .counter {
            position: relative;
            margin: 0 -16px 22px;
            /* Extra headroom so the jumping cat stays inside the header. */
            padding: calc(env(safe-area-inset-top) + 36px) 22px 26px;
            overflow: hidden;
        }

        .counter::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('coffee-bg.jpeg');
            background-size: 340px;
            background-position: 50% 32%;
            opacity: .42;
            filter: saturate(.6) contrast(.92);
            /* Fades the beans out at the bottom so the header does not end in
               a hard horizontal seam against the page. */
            -webkit-mask-image: linear-gradient(180deg, #000 52%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 52%, transparent 100%);
        }

        /* The scrim carries most of the header's depth so the beans stay a
           texture and never compete with the drink cards. */
        .counter::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(90% 120% at 82% 8%, rgba(23, 17, 13, .3), rgba(23, 17, 13, .82) 70%),
                linear-gradient(180deg, rgba(23, 17, 13, .72) 0%, rgba(23, 17, 13, .9) 58%, var(--roast-950) 100%);
        }

        .counter-inner {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .wordmark { flex: 1; min-width: 0; }

        .wordmark h1 {
            font-family: var(--font-sign);
            font-size: clamp(1.95rem, 8.2vw, 2.5rem);
            line-height: 1;
            letter-spacing: -.02em;
            color: var(--cream);
            text-shadow: 0 2px 0 rgba(12, 7, 4, .45), 0 14px 30px rgba(12, 7, 4, .5);
        }

        .tagline {
            margin-top: 8px;
            font-size: .82rem;
            font-weight: 500;
            line-height: 1.35;
            color: rgba(247, 240, 225, .58);
            text-wrap: balance;
        }

        /* ---------------- employee of the month easter egg ---------------- */

        .staff {
            position: relative;
            flex: 0 0 auto;
            width: 88px;
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            transition: transform .22s var(--ease-spring);
        }

        .staff:active { transform: scale(.94); }

        /* The frame is what jumps, so the badge ring travels with the photo
           instead of being left behind as a bare green disc. */
        .staff-frame {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(150deg, var(--accent) 0%, var(--accent-deep) 100%);
            box-shadow: var(--shadow-card);
            transform-origin: 50% 85%;
        }

        .staff img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            object-position: 50% 22%;
            background: var(--roast-800);
            display: block;
        }

        .staff-frame.puma-jump { animation: pumaJump 900ms cubic-bezier(.2, .8, .25, 1.2); }

        @keyframes pumaJump {
            0%   { transform: translateY(0) scale(1) rotate(0deg); }
            20%  { transform: translateY(-9px) scale(1.06) rotate(-5deg); }
            45%  { transform: translateY(-26px) scale(1.28) rotate(6deg); }
            65%  { transform: translateY(-7px) scale(1.09) rotate(-4deg); }
            82%  { transform: translateY(5px) scale(.96) rotate(3deg); }
            100% { transform: translateY(0) scale(1) rotate(0deg); }
        }

        /* A crown that only shows up while Puma is mid air. Sits outside
           .staff-frame so its lift does not compound with the jump. */
        .staff-crown {
            position: absolute;
            top: 0;
            left: 50%;
            font-size: 1.15rem;
            opacity: 0;
            transform: translate(-50%, 8px) scale(.5);
            pointer-events: none;
        }

        .staff.meowing .staff-crown { animation: crownPop 900ms var(--ease-spring); }

        @keyframes crownPop {
            0%   { opacity: 0; transform: translate(-50%, 8px) scale(.5) rotate(0deg); }
            35%  { opacity: 1; transform: translate(-50%, -22px) scale(1.15) rotate(-12deg); }
            70%  { opacity: 1; transform: translate(-50%, -26px) scale(1) rotate(10deg); }
            100% { opacity: 0; transform: translate(-50%, -34px) scale(.9) rotate(0deg); }
        }

        .staff-tag {
            font-size: .6rem;
            font-weight: 600;
            line-height: 1.15;
            text-align: center;
            color: rgba(251, 246, 234, .55);
            letter-spacing: .02em;
        }

        /* Deadpan on purpose. A loud warning label would flatten the joke and
           add a third green element to the header. */
        .staff-tag b {
            display: block;
            color: rgba(247, 240, 225, .8);
            font-weight: 700;
            font-size: .66rem;
        }

        /* Opens inward (left: 100%) so it never runs off the screen edge: the
           avatar sits in the far corner of the header. */
        .meow-bubble {
            position: absolute;
            top: 2px;
            left: 100%;
            margin-left: 8px;
            padding: 7px 13px;
            border-radius: 999px;
            background: var(--cream);
            color: var(--ink);
            font-family: var(--font-sign);
            font-size: 1rem;
            white-space: nowrap;
            box-shadow: var(--shadow-card);
            pointer-events: none;
            opacity: 0;
            transform: scale(.4);
            transform-origin: 0 50%;
            z-index: 2;
        }

        .staff.meowing .meow-bubble { animation: meowPop 950ms var(--ease-spring); }

        @keyframes meowPop {
            0%   { opacity: 0; transform: scale(.4) rotate(0deg); }
            18%  { opacity: 1; transform: scale(1.12) rotate(-5deg); }
            55%  { opacity: 1; transform: scale(1) rotate(2deg); }
            100% { opacity: 0; transform: scale(.94) rotate(0deg) translateY(-10px); }
        }

        /* ---------------- open sign / connection ---------------- */

        .open-sign {
            position: relative;
            z-index: 1;
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px 5px 10px;
            border-radius: 999px;
            font-size: .7rem;
            font-weight: 600;
            background: rgba(251, 246, 234, .08);
            border: 1px solid rgba(251, 246, 234, .14);
            color: rgba(251, 246, 234, .78);
            transition: color .25s, background .25s, border-color .25s;
        }

        .open-sign .bulb {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 0 0 currentColor;
        }

        .open-sign.is-open {
            color: var(--accent);
            background: rgba(168, 209, 108, .12);
            border-color: rgba(168, 209, 108, .3);
        }

        .open-sign.is-open .bulb { animation: bulbPulse 2.4s ease-out infinite; }

        @keyframes bulbPulse {
            0%   { box-shadow: 0 0 0 0 rgba(168, 209, 108, .6); }
            70%  { box-shadow: 0 0 0 9px rgba(168, 209, 108, 0); }
            100% { box-shadow: 0 0 0 0 rgba(168, 209, 108, 0); }
        }

        .open-sign.is-shut { color: #e8a08c; background: rgba(196, 85, 60, .14); border-color: rgba(196, 85, 60, .32); }

        /* ---------------- section headings ---------------- */

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .section-head h2 {
            font-family: var(--font-sign);
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 1.1;
            color: var(--cream);
        }

        .section-head .count {
            color: rgba(251, 246, 234, .42);
            font-family: var(--font-ui);
            font-size: .95rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        section + section { margin-top: 30px; }

        /* ---------------- the usual (one tap reorder) ---------------- */

        .usual {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            max-width: 100%;
            padding: 8px 8px 8px 15px;
            border: 1px dashed rgba(168, 209, 108, .5);
            border-radius: 999px;
            background: rgba(168, 209, 108, .1);
            color: var(--accent);
            font-family: inherit;
            font-size: .82rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .2s var(--ease-spring), background .2s;
        }

        .usual:active { transform: scale(.95); }
        .usual:hover { background: rgba(168, 209, 108, .18); }
        .usual img { width: 26px; height: 26px; object-fit: contain; }
        .usual span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ---------------- drink picker ---------------- */

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .drink {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 84px;
            padding: 14px 16px;
            border: 1.5px solid var(--cream-line);
            border-radius: var(--r-card);
            background: var(--cream);
            color: var(--ink);
            font-family: inherit;
            text-align: right;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            transition: transform .2s var(--ease-spring), box-shadow .2s var(--ease-out),
                        border-color .2s, background .2s;
        }

        .drink:active { transform: scale(.96); }

        @media (hover: hover) {
            .drink:hover {
                transform: translateY(-3px);
                box-shadow: var(--shadow-lift);
                border-color: var(--accent-deep);
            }
            .drink:hover img { transform: scale(1.09) rotate(-3deg); }
        }

        .drink:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        .drink img {
            width: 46px;
            height: 46px;
            flex: 0 0 auto;
            object-fit: contain;
            transition: transform .25s var(--ease-spring);
        }

        .drink h3 {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -.01em;
        }

        .drink > h3,
        .drink > span { flex: 1; min-width: 0; }

        /* The house drink gets the whole first row. 7 drinks, 7 cells,
           no orphan tile. */
        /* row-reverse anchors the big cup in the far corner and puts the name
           at the reading edge, so the extra width reads as a counter sign
           instead of an empty slab. */
        .drink--hero {
            grid-column: 1 / -1;
            flex-direction: row-reverse;
            justify-content: space-between;
            min-height: 108px;
            padding: 16px 22px;
            gap: 16px;
            background: linear-gradient(150deg, var(--cream) 0%, var(--cream-sunk) 100%);
        }

        .drink--hero > span { flex: 0 1 auto; }

        .drink--hero img { width: 72px; height: 72px; }

        .drink--hero h3 {
            font-family: var(--font-sign);
            font-size: 1.55rem;
            font-weight: 400;
            letter-spacing: -.02em;
        }

        .drink-flag {
            display: inline-block;
            margin-top: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--accent-ink);
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .01em;
        }

        .drink.is-picked {
            background: var(--accent);
            border-color: var(--accent-deep);
            color: var(--accent-ink);
            box-shadow: 0 2px 2px rgba(12, 7, 4, .18), 0 14px 30px -8px rgba(111, 156, 56, .55);
        }

        /* Selected state keeps the illustration in full colour and marks the
           card instead of bleaching the artwork to a white silhouette. */
        .drink.is-picked .drink-flag { background: var(--accent-ink); color: var(--accent); }

        .drink.is-picked::after {
            content: '✓';
            position: absolute;
            top: 9px;
            left: 11px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent-ink);
            color: var(--accent);
            font-size: .8rem;
            font-weight: 700;
            display: grid;
            place-items: center;
            animation: tickIn .28s var(--ease-spring);
        }

        @keyframes tickIn {
            from { opacity: 0; transform: scale(.3); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* ---------------- order sheet ---------------- */

        .sheet {
            position: fixed;
            z-index: 60;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
            background: var(--cream);
            border-radius: 26px 26px 0 0;
            box-shadow: 0 -3px 0 rgba(111, 156, 56, .5), 0 -22px 50px rgba(12, 7, 4, .6);
            transform: translateY(105%);
            transition: transform .34s var(--ease-out);
        }

        .sheet.is-up { transform: translateY(0); }

        .sheet-body {
            max-width: 728px;
            margin: 0 auto;
            display: grid;
            gap: 11px;
        }

        .sheet-drink {
            display: flex;
            align-items: center;
            gap: 11px;
            padding-bottom: 11px;
            border-bottom: 1px solid var(--cream-line);
        }

        .sheet-drink img { width: 40px; height: 40px; object-fit: contain; }

        .sheet-drink strong {
            flex: 1;
            min-width: 0;
            font-size: 1.12rem;
            font-weight: 600;
            color: var(--ink);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sheet-swap {
            flex: 0 0 auto;
            padding: 8px 14px;
            border: 1.5px solid var(--cream-line);
            border-radius: 999px;
            background: transparent;
            color: var(--ink-soft);
            font-family: inherit;
            font-size: .8rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .18s var(--ease-spring), border-color .2s, color .2s;
        }

        .sheet-swap:active { transform: scale(.94); }
        .sheet-swap:hover { border-color: var(--ink-soft); color: var(--ink); }

        .field { display: grid; gap: 5px; }

        .field label {
            font-size: .78rem;
            font-weight: 600;
            color: var(--ink-soft);
        }

        .field input {
            width: 100%;
            min-height: 50px;
            padding: 12px 15px;
            border: 1.5px solid var(--cream-line);
            border-radius: var(--r-block);
            background: #fff;
            color: var(--ink);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color .2s, box-shadow .2s;
        }

        .field input::placeholder { color: #a2907c; }

        .field input:focus {
            outline: none;
            border-color: var(--accent-deep);
            box-shadow: 0 0 0 3px rgba(168, 209, 108, .34);
        }

        .field.has-error input { border-color: var(--brick); }
        .field.has-error input:focus { box-shadow: 0 0 0 3px rgba(196, 85, 60, .3); }

        .field-error {
            font-size: .76rem;
            font-weight: 600;
            color: var(--brick);
        }

        .field.has-error input { animation: nudge .34s ease; }

        @keyframes nudge {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .send {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            width: 100%;
            min-height: 56px;
            margin-top: 3px;
            padding: 0 22px;
            border: 0;
            border-radius: 999px;
            background: var(--accent);
            color: var(--accent-ink);
            font-family: inherit;
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: -.01em;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--accent-deep), 0 12px 24px -6px rgba(111, 156, 56, .6);
            transition: transform .16s var(--ease-spring), box-shadow .16s var(--ease-out), background .2s;
        }

        /* Physical push: the button drops onto its own 4px ledge. */
        .send:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--accent-deep), 0 6px 14px -6px rgba(111, 156, 56, .5);
        }

        .send:disabled {
            background: var(--cream-sunk);
            color: var(--ink-soft);
            box-shadow: 0 4px 0 var(--cream-line);
            cursor: progress;
        }

        .send:focus-visible { outline: 3px solid var(--roast-800); outline-offset: 3px; }

        /* ---------------- queue ---------------- */

        /* auto-fit so a single group fills the row instead of being stranded
           in one half of a rigid 2-column grid. */
        .queue-columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 20px;
            align-items: start;
        }

        .queue-group + .queue-group { margin-top: 20px; }

        .queue-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: .82rem;
            font-weight: 700;
            letter-spacing: .04em;
            color: rgba(251, 246, 234, .58);
        }

        .queue-label .n {
            font-variant-numeric: tabular-nums;
            color: rgba(251, 246, 234, .38);
        }

        .queue-group--ready .queue-label { color: var(--accent); }

        .tickets { display: grid; gap: 11px; }

        .ticket {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 13px;
            padding: 14px 16px;
            border-radius: var(--r-card);
            background: var(--cream);
            color: var(--ink);
            box-shadow: var(--shadow-card);
        }

        .ticket.is-new { animation: ticketIn .5s var(--ease-spring); }

        @keyframes ticketIn {
            from { opacity: 0; transform: translateY(-14px) scale(.94); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .ticket-cup {
            position: relative;
            width: 46px;
            height: 46px;
            border-radius: var(--r-block);
            background: var(--cream-sunk);
            display: grid;
            place-items: center;
        }

        .ticket-cup img { width: 34px; height: 34px; object-fit: contain; }

        /* Steam only on drinks still being made. Communicates state, so it
           earns its infinite loop. */
        .ticket-cup .steam {
            position: absolute;
            top: -7px;
            left: 50%;
            width: 4px;
            height: 11px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(122, 99, 80, .55), rgba(122, 99, 80, 0));
            transform: translateX(-50%);
            animation: steamUp 2.1s ease-in-out infinite;
        }

        /* nth-of-type, not nth-child: the <img> is also a child of .ticket-cup,
           which previously left two wisps stacked on the same axis. */
        .ticket-cup .steam:nth-of-type(2) { margin-left: -8px; animation-delay: .6s; }
        .ticket-cup .steam:nth-of-type(3) { margin-left: 8px; animation-delay: 1.2s; }

        @keyframes steamUp {
            0%   { opacity: 0; transform: translate(-50%, 4px) scaleY(.6); }
            40%  { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -12px) scaleY(1.3); }
        }

        .ticket-top {
            display: flex;
            align-items: baseline;
            gap: 9px;
        }

        .ticket-drink {
            flex: 1;
            min-width: 0;
            font-size: 1.06rem;
            font-weight: 600;
            line-height: 1.25;
            letter-spacing: -.01em;
        }

        .ticket-time {
            flex: 0 0 auto;
            font-size: .76rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--ink-soft);
        }

        .ticket-who {
            margin-top: 2px;
            font-size: .92rem;
            font-weight: 500;
            color: var(--ink-soft);
        }

        .ticket-note {
            margin-top: 8px;
            padding: 7px 11px;
            border-radius: 10px;
            background: var(--cream-sunk);
            font-size: .86rem;
            line-height: 1.4;
            color: var(--ink);
        }

        .ticket-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 11px;
        }

        .act {
            min-height: 42px;
            padding: 0 17px;
            border: 0;
            border-radius: 999px;
            background: var(--ink);
            color: var(--cream);
            font-family: inherit;
            font-size: .88rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .18s var(--ease-spring), background .2s;
        }

        .act:active { transform: scale(.94); }
        .act:hover { background: #40291a; }

        .act--go { background: var(--accent-deep); color: #fff; }
        .act--go:hover { background: #5e8630; }

        .act--kill {
            min-width: 42px;
            padding: 0 12px;
            margin-inline-start: auto;
            background: transparent;
            color: #b0705f;
            font-size: 1rem;
        }

        .act--kill:hover { background: rgba(196, 85, 60, .12); color: var(--brick); }

        /* Ready tickets are filled, not merely recoloured. */
        .ticket--ready {
            background: linear-gradient(150deg, #bcdd88 0%, var(--accent) 100%);
            color: var(--accent-ink);
            box-shadow: 0 2px 2px rgba(12, 7, 4, .18), 0 16px 34px -10px rgba(111, 156, 56, .6);
        }

        .ticket--ready .ticket-cup { background: rgba(30, 43, 14, .13); }
        .ticket--ready .ticket-time,
        .ticket--ready .ticket-who { color: rgba(30, 43, 14, .72); }
        .ticket--ready .ticket-note { background: rgba(255, 255, 255, .48); color: var(--accent-ink); }
        .ticket--ready .act { background: var(--accent-ink); color: var(--accent); }
        .ticket--ready .act:hover { background: #101804; }
        .ticket--ready .act--kill { background: transparent; color: rgba(30, 43, 14, .5); }
        .ticket--ready .act--kill:hover { background: rgba(30, 43, 14, .12); color: var(--accent-ink); }

        .ticket--ready .ticket-drink::after {
            content: '☕';
            margin-inline-start: 7px;
            display: inline-block;
            animation: readyWiggle 2.6s var(--ease-out) infinite;
        }

        @keyframes readyWiggle {
            0%, 70%, 100% { transform: rotate(0deg); }
            78% { transform: rotate(-16deg) scale(1.12); }
            88% { transform: rotate(12deg) scale(1.08); }
        }

        .ticket.just-ready { animation: ticketFlip .62s var(--ease-spring); }

        @keyframes ticketFlip {
            0%   { transform: scale(1) rotate(0deg); }
            35%  { transform: scale(1.05) rotate(-1.4deg); }
            65%  { transform: scale(1.02) rotate(1deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* ---------------- empty state ---------------- */

        .empty {
            padding: 34px 22px;
            border: 1.5px dashed rgba(251, 246, 234, .18);
            border-radius: var(--r-card);
            text-align: center;
        }

        .empty .mug {
            font-size: 2.5rem;
            display: block;
            animation: mugSnooze 4s ease-in-out infinite;
        }

        @keyframes mugSnooze {
            0%, 100% { transform: rotate(-7deg); }
            50% { transform: rotate(7deg); }
        }

        .empty h3 {
            margin-top: 12px;
            font-family: var(--font-sign);
            font-size: 1.22rem;
            font-weight: 400;
            color: var(--cream);
        }

        .empty p {
            margin-top: 6px;
            font-size: .9rem;
            line-height: 1.5;
            color: rgba(251, 246, 234, .55);
        }

        /* ---------------- clear all ---------------- */

        /* Destructive and rarely wanted, so it reads as a quiet link rather
           than competing with the section title. */
        .wipe {
            flex: 0 0 auto;
            min-height: 40px;
            padding: 0 12px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: rgba(247, 240, 225, .38);
            font-family: inherit;
            font-size: .78rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .18s var(--ease-spring), background .2s, color .2s;
        }

        .wipe:active { transform: scale(.94); }
        .wipe:hover { background: rgba(196, 85, 60, .16); color: #eda690; }

        /* ---------------- toast ---------------- */

        .toasts {
            position: fixed;
            z-index: 80;
            top: calc(env(safe-area-inset-top) + 12px);
            right: 12px;
            left: 12px;
            display: grid;
            gap: 8px;
            justify-items: center;
            pointer-events: none;
        }

        .toast {
            max-width: 420px;
            padding: 12px 18px;
            border-radius: 999px;
            font-size: .9rem;
            font-weight: 600;
            text-align: center;
            box-shadow: var(--shadow-lift);
            animation: toastIn .34s var(--ease-spring);
        }

        .toast--ok { background: var(--accent); color: var(--accent-ink); }
        .toast--bad { background: var(--brick); color: #fff2ee; }

        .toast.is-out { animation: toastOut .3s var(--ease-out) forwards; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-16px) scale(.9); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes toastOut {
            to { opacity: 0; transform: translateY(-12px) scale(.96); }
        }

        /* ---------------- order celebration ---------------- */

        .order-celebration {
            position: fixed;
            inset: 0;
            z-index: 90;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
            animation: celebrationOverlay 1.95s ease-out forwards;
        }

        .celebration-wave {
            position: absolute;
            left: -14%;
            bottom: -126%;
            width: 128%;
            height: 236%;
            border-radius: 46% 44% 0 0 / 10% 10% 0 0;
            background:
                radial-gradient(120% 36% at 50% 4%, rgba(255, 238, 207, .26), rgba(255, 238, 207, 0) 58%),
                linear-gradient(180deg, #8b5730 0%, #5d3720 44%, #33200f 100%);
            box-shadow: inset 0 16px 28px rgba(255, 227, 178, .14), inset 0 -40px 88px rgba(20, 10, 4, .46);
            transform: translate3d(0, 108%, 0);
            will-change: transform;
            animation: coffeeRise 1.5s cubic-bezier(.24, .84, .24, 1) forwards;
        }

        .coffee-surface {
            position: absolute;
            top: 4%;
            left: -8%;
            width: 116%;
            height: 150px;
            background:
                radial-gradient(95% 120% at 50% 100%, rgba(255, 242, 214, .32) 0 26%, rgba(255, 242, 214, 0) 64%),
                repeating-radial-gradient(circle at 8% 110%, rgba(255, 236, 196, .25) 0 22px, rgba(255, 236, 196, .02) 22px 52px);
            filter: blur(1px);
            animation: coffeeSurfaceDrift 1.25s ease-in-out infinite;
        }

        .celebration-badge {
            position: absolute;
            top: calc(env(safe-area-inset-top) + 14%);
            left: 50%;
            z-index: 2;
            max-width: calc(100vw - 32px);
            padding: 13px 24px;
            border-radius: 999px;
            background: var(--cream);
            color: var(--ink);
            font-family: var(--font-sign);
            font-size: clamp(1rem, 4.4vw, 1.3rem);
            line-height: 1.25;
            text-align: center;
            box-shadow: 0 14px 34px rgba(20, 10, 4, .5);
            transform: translate(-50%, 22px) scale(.86);
            opacity: 0;
            animation: coffeeBadge 1.7s var(--ease-spring) forwards;
        }

        .celebration-particle {
            position: absolute;
            left: var(--x, 50%);
            bottom: calc(env(safe-area-inset-bottom) + 6%);
            z-index: 1;
            width: var(--size, 12px);
            height: var(--size, 12px);
            border-radius: 999px;
            background: radial-gradient(circle at 34% 34%, rgba(255, 255, 255, .95), rgba(255, 255, 255, .26) 40%, rgba(255, 222, 170, .04) 68%, rgba(255, 222, 170, 0) 76%);
            border: 1px solid rgba(255, 246, 228, .3);
            opacity: 0;
            transform: translate3d(0, 0, 0) scale(.46);
            animation: coffeeBubble var(--duration, 1.2s) ease-out forwards;
            animation-delay: var(--delay, 0s);
            will-change: transform, opacity;
        }

        @keyframes celebrationOverlay {
            0% { opacity: 0; } 8% { opacity: 1; } 84% { opacity: 1; } 100% { opacity: 0; }
        }

        @keyframes coffeeRise {
            0% { transform: translate3d(0, 108%, 0); }
            55% { transform: translate3d(0, 17%, 0); }
            78% { transform: translate3d(0, -6%, 0); }
            100% { transform: translate3d(0, 0, 0); }
        }

        @keyframes coffeeSurfaceDrift {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-7%); }
        }

        @keyframes coffeeBadge {
            0%   { opacity: 0; transform: translate(-50%, 22px) scale(.86); }
            25%  { opacity: 1; transform: translate(-50%, -3px) scale(1.04); }
            70%  { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -18px) scale(.95); }
        }

        @keyframes coffeeBubble {
            0%   { opacity: 0; transform: translate3d(0, 0, 0) scale(.46); }
            18%  { opacity: .82; }
            100% { opacity: 0; transform: translate3d(var(--drift, 0px), var(--rise, -56vh), 0) scale(1); }
        }

        /* Small burst on the ticket that just became ready. */
        .pop-layer {
            position: absolute;
            inset: 0;
            overflow: visible;
            pointer-events: none;
        }

        .pop {
            position: absolute;
            top: 50%;
            right: 30px;
            width: 9px;
            height: 9px;
            border-radius: 2px;
            background: var(--c, #fff);
            opacity: 0;
            animation: popOut .85s var(--ease-out) forwards;
            animation-delay: var(--d, 0s);
        }

        @keyframes popOut {
            0%   { opacity: 1; transform: translate(0, 0) scale(.4) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); }
        }

        /* ---------------- desktop ---------------- */

        @media (min-width: 720px) {
            .shell { padding-bottom: 40px; }
            .menu-grid { grid-template-columns: repeat(3, 1fr); }

            /* Full-width hero would otherwise leave a 500px void, so the
               lockup spans the card like a counter sign. */
            /* Wide and shallow reads as a counter sign; wide and tall reads as
               an empty box. */
            .drink--hero { padding: 14px 30px; min-height: 100px; }
            .drink--hero img { width: 76px; height: 76px; }
            .drink--hero h3 { font-size: 1.75rem; }

            .queue-group + .queue-group { margin-top: 0; }
            .sheet {
                right: auto;
                left: 50%;
                bottom: 20px;
                width: min(560px, calc(100vw - 40px));
                transform: translate(-50%, calc(100% + 30px));
                border-radius: var(--r-card);
                box-shadow: 0 3px 0 rgba(111, 156, 56, .5), 0 26px 60px rgba(12, 7, 4, .6);
            }
            .sheet.is-up { transform: translate(-50%, 0); }
        }

        @media (max-width: 380px) {
            .staff { width: 74px; }
            .staff-frame { width: 60px; height: 60px; }
            .drink { min-height: 78px; padding: 12px 13px; gap: 9px; }
            .drink img { width: 40px; height: 40px; }
            .drink h3 { font-size: .92rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="counter">
            <div class="counter-inner">
                <div class="wordmark">
                    <h1>Coffee Shaky</h1>
                    <p class="tagline">בית קפה משפחתי, ללא כוונת רווח.</p>
                </div>

                <button class="staff" id="employeeBanner" type="button"
                        aria-label="עובד החודש. אמרנו לא ללחוץ.">
                    <span class="staff-frame">
                        <img id="employeeImage" src="employee.jpg" alt="עובדת החודש">
                    </span>
                    <span class="staff-crown" aria-hidden="true">👑</span>
                    <span class="staff-tag">עובד החודש<b>אל תלחצו</b></span>
                    <span class="meow-bubble" aria-hidden="true">מיאו!</span>
                </button>
            </div>

            <div class="open-sign" id="connectionStatus">
                <span class="bulb" aria-hidden="true"></span>
                <span id="connectionText">מדליקים את המכונה</span>
            </div>
        </header>

        <main>
            <section class="menu" aria-labelledby="menuHead">
                <div class="section-head">
                    <h2 id="menuHead">מה שותים?</h2>
                    <button class="usual" id="usualBtn" type="button" hidden>
                        <img id="usualIcon" alt="">
                        <span id="usualLabel"></span>
                    </button>
                </div>

                <div class="menu-grid">
                    <button class="drink drink--hero" type="button" data-product="הפוך הבית" data-icon="./cappuccinoIcon.png">
                        <img src="./cappuccinoIcon.png" alt="">
                        <span>
                            <h3>הפוך הבית</h3>
                            <span class="drink-flag">הכי מוזמן בבית</span>
                        </span>
                    </button>

                    <button class="drink" type="button" data-product="אספרסו" data-icon="./espresso.png">
                        <img src="./espresso.png" alt="">
                        <h3>אספרסו</h3>
                    </button>

                    <button class="drink" type="button" data-product="שקדיאטו" data-icon="./macchiatoIcon.png">
                        <img src="./macchiatoIcon.png" alt="">
                        <h3>שקדיאטו</h3>
                    </button>

                    <button class="drink" type="button" data-product="אמריקנו" data-icon="./americanoIcon.png">
                        <img src="./americanoIcon.png" alt="">
                        <h3>אמריקנו</h3>
                    </button>

                    <button class="drink" type="button" data-product="קפה יובל" data-icon="./flatWhiteIcon.svg">
                        <img src="./flatWhiteIcon.svg" alt="">
                        <h3>קפה יובל</h3>
                    </button>

                    <button class="drink" type="button" data-product="תה" data-icon="./teaIcon.png">
                        <img src="./teaIcon.png" alt="">
                        <h3>תה</h3>
                    </button>

                    <button class="drink" type="button" data-product="אחר" data-icon="./otherIcon.png">
                        <img src="./otherIcon.png" alt="">
                        <h3>אחר</h3>
                    </button>
                </div>
            </section>

            <section class="queue" aria-labelledby="queueHead">
                <div class="section-head">
                    <h2 id="queueHead">התור <span class="count" id="queueCount"></span></h2>
                    <button class="wipe" type="button" onclick="clearAllOrders()">נקה את התור</button>
                </div>
                <div id="ordersContainer"></div>
            </section>
        </main>
    </div>

    <form class="sheet" id="orderForm" autocomplete="off">
        <div class="sheet-body">
            <div class="sheet-drink">
                <img id="sheetIcon" src="" alt="">
                <strong id="sheetName"></strong>
                <button class="sheet-swap" type="button" id="sheetSwap">שנה</button>
            </div>

            <div class="field" id="nameField">
                <label for="customerName">מי שותה?</label>
                <input type="text" id="customerName" placeholder="השם שלך" enterkeyhint="next">
                <span class="field-error" id="nameError" hidden></span>
            </div>

            <div class="field" id="noteField">
                <label for="specialRequest">משהו מיוחד? <span id="noteHint"></span></label>
                <input type="text" id="specialRequest" placeholder="חלב שקדים, בלי סוכר, בלי לשפוך" enterkeyhint="send">
                <span class="field-error" id="noteError" hidden></span>
            </div>

            <button class="send" type="submit" id="submitBtn">שלח לבריסטה</button>
        </div>
    </form>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="firebase-config.js"></script>
    <script type="module" src="firebase-db.js"></script>
    <script>
        function debugLog(message, data = null) {
            console.log(`[Coffee Shaky] ${message}`, data ?? '');
        }

        let orders = [];
        let selectedProduct = null;
        let selectedIcon = null;
        let unsubscribeOrders = null;

        const MEOW_SOUND_FILE = 'מיאו.wav';
        const NAME_KEY = 'coffeeShaky.name';
        const USUAL_KEY = 'coffeeShaky.usual';

        let catMeowAudio = null;
        let pumaResetTimeout = null;
        let orderCelebrationTimeout = null;

        // Realtime bookkeeping: Firestore re-delivers the whole list on every
        // change, so remember what we have already shown to tell a genuinely
        // new ticket apart from a re-render, and to catch preparing -> ready.
        const seenOrderIds = new Set();
        const knownStatuses = new Map();
        let firstRenderDone = false;

        const EMPTY_LINES = [
            { title: 'התור ריק.', body: 'הבריסטה גולל ברשתות. זה הזמן לנצל את זה.' },
            { title: 'אף אחד לא רוצה קפה?', body: 'מצב חשוד. בדרך כלל יש כאן תור.' },
            { title: 'שקט תעשייתי במטבח.', body: 'המכונה חמה, החלב במקרר, קדימה.' }
        ];
        const emptyLine = EMPTY_LINES[Math.floor(Math.random() * EMPTY_LINES.length)];

        document.addEventListener('DOMContentLoaded', function () {
            initializeApp();
        });

        function initializeApp() {
            try {
                setupMenuSelection();
                setupOrderSheet();
                setupEmployeeOfTheMonth();
                restoreUsual();
                renderOrders();

                if (!window.CoffeeDB) {
                    throw new Error('firebase-db.js did not load');
                }
                if (window.CoffeeDB.initError) {
                    throw window.CoffeeDB.initError;
                }

                startOrdersStream();
                debugLog('ready');
            } catch (error) {
                debugLog('init failed', error);
                showToast('המכונה לא מתניעה: ' + error.message, 'bad', 7000);
                updateConnectionStatus(false);
            }
        }

        /* ---------------- drink picking ---------------- */

        function setupMenuSelection() {
            document.querySelectorAll('.drink').forEach(item => {
                item.addEventListener('click', () => {
                    pickDrink(item.dataset.product, item.dataset.icon);
                });
            });
        }

        function pickDrink(product, icon, options = {}) {
            selectedProduct = product;
            selectedIcon = icon;

            document.querySelectorAll('.drink').forEach(el => {
                el.classList.toggle('is-picked', el.dataset.product === product);
                el.setAttribute('aria-pressed', el.dataset.product === product ? 'true' : 'false');
            });

            document.getElementById('sheetIcon').src = icon;
            document.getElementById('sheetName').textContent = product;

            // "אחר" has no fixed recipe, so the note carries the whole order.
            const isOther = product === 'אחר';
            document.getElementById('noteHint').textContent = isOther ? '(חובה כאן)' : '(לא חייב)';
            document.getElementById('specialRequest').placeholder = isOther
                ? 'מה בדיוק להכין?'
                : 'חלב שקדים, בלי סוכר, בלי לשפוך';

            clearFieldError('nameField', 'nameError');
            clearFieldError('noteField', 'noteError');

            openSheet();

            if (options.silentFocus) return;

            const nameInput = document.getElementById('customerName');
            if (isOther) {
                document.getElementById('specialRequest').focus();
            } else if (!nameInput.value.trim()) {
                nameInput.focus();
            }
        }

        function openSheet() {
            const sheet = document.getElementById('orderForm');
            sheet.classList.add('is-up');
            // Keep the queue reachable above the raised sheet.
            requestAnimationFrame(() => {
                document.querySelector('.shell').style.paddingBottom = (sheet.offsetHeight + 28) + 'px';
            });
        }

        function closeSheet() {
            document.getElementById('orderForm').classList.remove('is-up');
            document.querySelector('.shell').style.paddingBottom = '';
        }

        function setupOrderSheet() {
            document.getElementById('orderForm').addEventListener('submit', event => {
                event.preventDefault();
                submitOrder();
            });

            document.getElementById('sheetSwap').addEventListener('click', () => {
                cancelOrder();
                document.querySelector('.menu').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            const savedName = localStorage.getItem(NAME_KEY);
            if (savedName) {
                document.getElementById('customerName').value = savedName;
            }

            document.getElementById('customerName').addEventListener('input', () => {
                clearFieldError('nameField', 'nameError');
            });
            document.getElementById('specialRequest').addEventListener('input', () => {
                clearFieldError('noteField', 'noteError');
            });

            document.getElementById('usualBtn').addEventListener('click', repeatUsual);
        }

        /* ---------------- the usual (one tap reorder) ---------------- */

        function restoreUsual() {
            let usual = null;
            try {
                usual = JSON.parse(localStorage.getItem(USUAL_KEY) || 'null');
            } catch (error) {
                usual = null;
            }

            if (!usual || !usual.product) return;

            const card = document.querySelector(`.drink[data-product="${cssEscape(usual.product)}"]`);
            if (!card) return;

            const btn = document.getElementById('usualBtn');
            document.getElementById('usualIcon').src = card.dataset.icon;
            document.getElementById('usualLabel').textContent = 'עוד ' + usual.product + '?';
            btn.hidden = false;
        }

        function rememberUsual(product, customerName, specialRequest) {
            try {
                localStorage.setItem(NAME_KEY, customerName);
                localStorage.setItem(USUAL_KEY, JSON.stringify({ product, specialRequest }));
            } catch (error) {
                debugLog('could not save the usual', error);
            }
            restoreUsual();
        }

        // One tap: refills the exact previous order and lands on the send button.
        function repeatUsual() {
            let usual = null;
            try {
                usual = JSON.parse(localStorage.getItem(USUAL_KEY) || 'null');
            } catch (error) {
                return;
            }
            if (!usual) return;

            const card = document.querySelector(`.drink[data-product="${cssEscape(usual.product)}"]`);
            if (!card) return;

            pickDrink(usual.product, card.dataset.icon, { silentFocus: true });
            document.getElementById('specialRequest').value = usual.specialRequest || '';
            document.getElementById('customerName').value = localStorage.getItem(NAME_KEY) || '';
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function cssEscape(value) {
            return String(value).replace(/["\\]/g, '\\$&');
        }

        /* ---------------- employee of the month ---------------- */

        function setupEmployeeOfTheMonth() {
            const employeeBanner = document.getElementById('employeeBanner');
            const employeeImage = document.getElementById('employeeImage');

            if (!employeeBanner || !employeeImage) return;

            // The ring frame is the element that jumps, so the badge travels
            // with the photo rather than staying behind.
            const employeeFrame = employeeBanner.querySelector('.staff-frame');
            const originalEmployeeSrc = employeeImage.getAttribute('src');
            const originalEmployeeAlt = employeeImage.getAttribute('alt');
            let originalImageFailed = false;

            // Preload the puma photo so the click-time src swap comes from cache.
            // Without this it can still be in flight when the animation ends and
            // we swap back, which aborts the load and fires 'error' on the <img>.
            const pumaPreload = new Image();
            pumaPreload.src = 'puma.jpeg';

            // Only a broken original portrait should hide the photo. An aborted
            // puma load must never leave the element permanently invisible.
            employeeImage.addEventListener('error', () => {
                if (employeeImage.getAttribute('src') !== originalEmployeeSrc) return;
                originalImageFailed = true;
                employeeImage.style.visibility = 'hidden';
            });

            const restoreEmployeeImage = () => {
                employeeFrame.classList.remove('puma-jump');
                employeeImage.src = originalEmployeeSrc;
                employeeImage.alt = originalEmployeeAlt;
                employeeImage.style.visibility = originalImageFailed ? 'hidden' : '';
            };

            const triggerPumaJump = () => {
                if (pumaResetTimeout) {
                    clearTimeout(pumaResetTimeout);
                    pumaResetTimeout = null;
                }

                employeeImage.src = 'puma.jpeg';
                employeeImage.alt = 'פומה, עובד החודש בפועל';

                employeeFrame.classList.remove('puma-jump');
                employeeBanner.classList.remove('meowing');

                // Force reflow so the animation restarts on every tap.
                void employeeFrame.offsetWidth;

                employeeFrame.classList.add('puma-jump');
                employeeBanner.classList.add('meowing');
                playCatMeow();

                if (navigator.vibrate) navigator.vibrate(18);

                employeeFrame.addEventListener('animationend', () => {
                    restoreEmployeeImage();
                    if (pumaResetTimeout) {
                        clearTimeout(pumaResetTimeout);
                        pumaResetTimeout = null;
                    }
                }, { once: true });

                // Listen on the bubble itself: animationend bubbles, so a listener
                // on the button would also catch the image's jump animation.
                const meowBubble = employeeBanner.querySelector('.meow-bubble');
                if (meowBubble) {
                    meowBubble.addEventListener('animationend', () => {
                        employeeBanner.classList.remove('meowing');
                    }, { once: true });
                }

                // Fallback in case animationend does not fire.
                pumaResetTimeout = setTimeout(() => {
                    restoreEmployeeImage();
                    employeeBanner.classList.remove('meowing');
                    pumaResetTimeout = null;
                }, 1100);
            };

            employeeBanner.addEventListener('click', triggerPumaJump);
        }

        function playCatMeow() {
            try {
                if (!catMeowAudio) {
                    catMeowAudio = new Audio(MEOW_SOUND_FILE);
                    catMeowAudio.preload = 'auto';
                }

                catMeowAudio.pause();
                catMeowAudio.currentTime = 0;
                const playPromise = catMeowAudio.play();

                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(error => {
                        debugLog('could not play the meow', error);
                        speakMeowFallback();
                    });
                }
            } catch (error) {
                debugLog('could not init the meow', error);
                speakMeowFallback();
            }
        }

        function speakMeowFallback() {
            if (!('speechSynthesis' in window)) return;

            const utterance = new SpeechSynthesisUtterance('מיאו');
            utterance.lang = 'he-IL';
            utterance.pitch = 1.8;
            utterance.rate = 0.95;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        /* ---------------- realtime stream ---------------- */

        // Single live listener: Firestore re-delivers the whole ordered list on
        // every change and handles reconnection itself, so there is no separate
        // load step and no manual retry loop.
        function startOrdersStream() {
            if (unsubscribeOrders) {
                unsubscribeOrders();
            }

            unsubscribeOrders = window.CoffeeDB.subscribeToOrders(
                liveOrders => {
                    orders = liveOrders;
                    renderOrders();
                },
                (connected, error) => {
                    updateConnectionStatus(connected);
                    if (error) {
                        debugLog('live orders error', error);
                        showToast('נפל החיבור למטבח: ' + error.message, 'bad', 6000);
                    }
                }
            );
        }

        function updateConnectionStatus(connected) {
            const sign = document.getElementById('connectionStatus');
            const text = document.getElementById('connectionText');

            sign.classList.toggle('is-open', connected);
            sign.classList.toggle('is-shut', !connected);
            text.textContent = connected ? 'פתוח · המכונה חמה' : 'אין קשר עם המטבח';
        }

        /* ---------------- ordering ---------------- */

        async function submitOrder() {
            const nameInput = document.getElementById('customerName');
            const noteInput = document.getElementById('specialRequest');
            const submitBtn = document.getElementById('submitBtn');

            const customerName = nameInput.value.trim();
            const specialRequest = noteInput.value.trim();

            if (!selectedProduct) {
                showToast('קודם בוחרים משקה', 'bad');
                return;
            }

            if (!customerName) {
                setFieldError('nameField', 'nameError', 'בלי שם הקפה יתקרר על הדלפק.');
                nameInput.focus();
                return;
            }

            if (selectedProduct === 'אחר' && !specialRequest) {
                setFieldError('noteField', 'noteError', '"אחר" זה לא הזמנה. מה להכין?');
                noteInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'רץ למטבח...';

            try {
                const orderedProduct = selectedProduct;

                // Firestore queues writes locally and resolves only once the
                // server acknowledges, so with no connection this never settles.
                // The order is safely stored and will send by itself, but say so
                // instead of leaving the button spinning forever.
                let acknowledged = false;
                const queuedNotice = setTimeout(() => {
                    if (acknowledged) return;
                    cancelOrder();
                    showToast('אין חיבור. ההזמנה שמורה ותישלח כשהרשת תחזור.', 'bad', 7000);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'שלח לבריסטה';
                }, 8000);

                try {
                    await window.CoffeeDB.createOrder({
                        productName: orderedProduct,
                        customerName: customerName,
                        specialRequest: specialRequest
                    });
                } finally {
                    acknowledged = true;
                    clearTimeout(queuedNotice);
                }

                rememberUsual(orderedProduct, customerName, specialRequest);
                cancelOrder();
                showOrderCelebration(orderedProduct);

            } catch (error) {
                debugLog('order failed', error);
                showToast('ההזמנה לא עברה: ' + error.message, 'bad', 6000);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'שלח לבריסטה';
            }
        }

        // Keeps the remembered name on purpose: in a family of five you should
        // never type your own name twice.
        function cancelOrder() {
            closeSheet();
            document.getElementById('specialRequest').value = '';
            selectedProduct = null;
            selectedIcon = null;

            document.querySelectorAll('.drink').forEach(item => {
                item.classList.remove('is-picked');
                item.setAttribute('aria-pressed', 'false');
            });
        }

        async function updateOrderStatus(orderId, newStatus) {
            try {
                await window.CoffeeDB.updateOrderStatus(orderId, newStatus);
            } catch (error) {
                debugLog('status update failed', error);
                showToast('לא הצלחתי לעדכן: ' + error.message, 'bad');
            }
        }

        async function completeOrder(orderId) {
            try {
                await window.CoffeeDB.removeOrder(orderId);
                showToast('בתיאבון', 'ok');
            } catch (error) {
                debugLog('complete failed', error);
                showToast('לא הצלחתי לסגור: ' + error.message, 'bad');
            }
        }

        async function deleteOrder(orderId) {
            if (!confirm('לבטל את ההזמנה הזו?')) return;

            try {
                await window.CoffeeDB.removeOrder(orderId);
            } catch (error) {
                debugLog('delete failed', error);
                showToast('לא הצלחתי למחוק: ' + error.message, 'bad');
            }
        }

        async function clearAllOrders() {
            if (!orders.length) {
                showToast('התור כבר ריק', 'ok');
                return;
            }

            if (!confirm('למחוק את כל התור? גם את זה שכבר מוכן.')) return;

            try {
                await window.CoffeeDB.removeAllOrders();
                showToast('הדלפק נוקה', 'ok');
            } catch (error) {
                debugLog('clear all failed', error);
                showToast('לא הצלחתי לנקות: ' + error.message, 'bad');
            }
        }

        /* ---------------- queue rendering ---------------- */

        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            const countEl = document.getElementById('queueCount');

            const preparing = orders.filter(order => order.status === 'preparing');
            const ready = orders.filter(order => order.status === 'ready');

            countEl.textContent = orders.length ? orders.length : '';

            if (!orders.length) {
                container.innerHTML = `
                    <div class="empty">
                        <span class="mug" aria-hidden="true">☕</span>
                        <h3>${escapeHtml(emptyLine.title)}</h3>
                        <p>${escapeHtml(emptyLine.body)}</p>
                    </div>
                `;
                knownStatuses.clear();
                firstRenderDone = true;
                return;
            }

            // Ready first: those are the ones somebody has to walk over and take.
            const groups = [
                { key: 'ready', label: 'מוכן לאיסוף', list: ready },
                { key: 'preparing', label: 'בהכנה', list: preparing }
            ].filter(group => group.list.length);

            const justReady = [];

            const html = groups.map(group => `
                <div class="queue-group queue-group--${group.key}">
                    <div class="queue-label">${escapeHtml(group.label)} <span class="n">${group.list.length}</span></div>
                    <div class="tickets">
                        ${group.list.map(order => renderTicket(order, justReady)).join('')}
                    </div>
                </div>
            `).join('');

            container.innerHTML = `<div class="queue-columns">${html}</div>`;

            orders.forEach(order => {
                seenOrderIds.add(order.id);
                knownStatuses.set(order.id, order.status);
            });

            // Forget ids that left the queue so a re-used id can animate again.
            const liveIds = new Set(orders.map(order => order.id));
            [...knownStatuses.keys()].forEach(id => {
                if (!liveIds.has(id)) {
                    knownStatuses.delete(id);
                    seenOrderIds.delete(id);
                }
            });

            justReady.forEach(id => burstOnTicket(id));
            firstRenderDone = true;
        }

        function renderTicket(order, justReady) {
            const timeString = order.created_at.toLocaleTimeString('he-IL', {
                hour: '2-digit',
                minute: '2-digit'
            });

            const isReady = order.status === 'ready';
            const isNew = firstRenderDone && !seenOrderIds.has(order.id);
            const turnedReady = firstRenderDone && isReady && knownStatuses.get(order.id) === 'preparing';

            if (turnedReady) justReady.push(order.id);

            const classes = ['ticket'];
            if (isReady) classes.push('ticket--ready');
            if (isNew) classes.push('is-new');
            if (turnedReady) classes.push('just-ready');

            const safeId = escapeHtml(order.id);
            const icon = iconForProduct(order.product_name);

            const action = isReady
                ? `<button class="act" type="button" onclick="completeOrder('${safeId}')">נאסף</button>`
                : `<button class="act act--go" type="button" onclick="updateOrderStatus('${safeId}', 'ready')">מוכן!</button>`;

            const steam = isReady ? '' : `
                <span class="steam" aria-hidden="true"></span>
                <span class="steam" aria-hidden="true"></span>
                <span class="steam" aria-hidden="true"></span>`;

            return `
                <article class="${classes.join(' ')}" data-order-id="${safeId}">
                    <div class="ticket-cup">
                        ${steam}
                        <img src="${escapeHtml(icon)}" alt="">
                    </div>
                    <div>
                        <div class="ticket-top">
                            <h3 class="ticket-drink">${escapeHtml(order.product_name)}</h3>
                            <span class="ticket-time">${escapeHtml(timeString)}</span>
                        </div>
                        <p class="ticket-who">${escapeHtml(order.customer_name)}</p>
                        ${order.special_request ? `<p class="ticket-note">${escapeHtml(order.special_request)}</p>` : ''}
                        <div class="ticket-actions">
                            ${action}
                            <button class="act act--kill" type="button" title="בטל הזמנה"
                                    aria-label="בטל הזמנה" onclick="deleteOrder('${safeId}')">✕</button>
                        </div>
                    </div>
                </article>
            `;
        }

        function iconForProduct(productName) {
            const card = document.querySelector(`.drink[data-product="${cssEscape(productName)}"]`);
            return card ? card.dataset.icon : './otherIcon.png';
        }

        /* ---------------- feedback ---------------- */

        function showToast(message, kind = 'ok', life = 3600) {
            const toast = document.createElement('div');
            toast.className = `toast toast--${kind === 'bad' ? 'bad' : 'ok'}`;
            toast.textContent = message;
            document.getElementById('toasts').appendChild(toast);

            setTimeout(() => {
                toast.classList.add('is-out');
                setTimeout(() => toast.remove(), 320);
            }, life);
        }

        // Tiny burst on the ticket that just flipped to ready. Fires on every
        // family phone watching the queue, which is the point.
        function burstOnTicket(orderId) {
            const ticket = document.querySelector(`.ticket[data-order-id="${cssEscape(orderId)}"]`);
            if (!ticket) return;

            const layer = document.createElement('div');
            layer.className = 'pop-layer';
            layer.setAttribute('aria-hidden', 'true');

            const colors = ['#fbf6ea', '#ffd884', '#6f9c38', '#c4553c'];

            for (let i = 0; i < 10; i++) {
                const bit = document.createElement('span');
                bit.className = 'pop';
                const angle = (Math.PI / 10) * i + Math.PI * 0.6;
                bit.style.setProperty('--dx', `${Math.cos(angle) * (48 + (i % 3) * 20)}px`);
                bit.style.setProperty('--dy', `${-Math.abs(Math.sin(angle)) * (40 + (i % 4) * 18)}px`);
                bit.style.setProperty('--rot', `${(i % 2 ? 1 : -1) * (120 + i * 22)}deg`);
                bit.style.setProperty('--c', colors[i % colors.length]);
                bit.style.setProperty('--d', `${i * 0.024}s`);
                layer.appendChild(bit);
            }

            ticket.style.position = 'relative';
            ticket.appendChild(layer);
            setTimeout(() => layer.remove(), 1100);
        }

        function setFieldError(fieldId, errorId, message) {
            const field = document.getElementById(fieldId);
            const error = document.getElementById(errorId);
            field.classList.remove('has-error');
            void field.offsetWidth;
            field.classList.add('has-error');
            error.textContent = message;
            error.hidden = false;
        }

        function clearFieldError(fieldId, errorId) {
            document.getElementById(fieldId).classList.remove('has-error');
            const error = document.getElementById(errorId);
            error.hidden = true;
            error.textContent = '';
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function showOrderCelebration(productName) {
            const previous = document.getElementById('orderCelebration');
            if (previous) previous.remove();

            if (orderCelebrationTimeout) {
                clearTimeout(orderCelebrationTimeout);
                orderCelebrationTimeout = null;
            }

            const celebration = document.createElement('div');
            celebration.id = 'orderCelebration';
            celebration.className = 'order-celebration';
            celebration.setAttribute('aria-hidden', 'true');

            const flood = document.createElement('div');
            flood.className = 'celebration-wave';

            const surface = document.createElement('div');
            surface.className = 'coffee-surface';
            flood.appendChild(surface);
            celebration.appendChild(flood);

            const badge = document.createElement('div');
            badge.className = 'celebration-badge';
            badge.textContent = productName ? `${productName} נכנס לתור` : 'ההזמנה נכנסה לתור';
            celebration.appendChild(badge);

            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            const particleCount = isMobile ? 10 : 14;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('span');
                particle.className = 'celebration-particle';
                const baseX = 7 + (86 / Math.max(1, particleCount - 1)) * i;
                const xOffset = i % 2 === 0 ? 1.8 : -1.8;
                const size = (isMobile ? 7 : 9) + (i % 4) * 2;
                const drift = (i % 2 === 0 ? -1 : 1) * (8 + (i % 3) * 7);
                const rise = -(isMobile ? 45 : 56) - (i % 5) * 7;
                const duration = (isMobile ? 1.02 : 1.2) + (i % 3) * 0.12;

                particle.style.setProperty('--x', `${Math.max(4, Math.min(96, baseX + xOffset))}%`);
                particle.style.setProperty('--size', `${size}px`);
                particle.style.setProperty('--drift', `${drift}px`);
                particle.style.setProperty('--rise', `${rise}vh`);
                particle.style.setProperty('--duration', `${duration}s`);
                particle.style.setProperty('--delay', `${0.08 + i * 0.045}s`);
                celebration.appendChild(particle);
            }

            document.body.appendChild(celebration);

            orderCelebrationTimeout = setTimeout(() => {
                celebration.remove();
                orderCelebrationTimeout = null;
            }, 2000);
        }
    </script>
</body>
</html>
