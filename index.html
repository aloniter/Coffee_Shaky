<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Coffee Shaky</title>
    <meta name="description" content="בית הקפה המשפחתי שלנו. בוחרים משקה, כותבים שם, והקפה בדרך.">
    <meta name="theme-color" content="#100e0c">

    <!-- Home Screen app: no Safari bars, its own name, dark status bar text
         on the cream page ("black-translucent" would turn it white). -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Coffee Shaky">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Cut from coffee-shaky-premium-icon.png, the source of truth. -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Suez+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/base-app.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/glass-app.css">
</head>
<body>
    <div class="awning" aria-hidden="true"></div>

    <div class="shell">
        <header class="counter">
            <div class="wordmark">
                <h1 lang="en" dir="ltr">Coffee <em>Shaky</em><span class="brand-dot">.</span></h1>
                <p class="tagline">הקפה הכי טוב ברדיוס של ארבעה מטרים.</p>
            </div>
            <button class="staff" id="employeeBanner" type="button" aria-label="תלחצו על עובד החודש שיעבוד מהר יותר">
                <span class="staff-frame"><img id="employeeImage" src="employee.jpg" alt="עובדת החודש"></span>
                <span class="staff-tag">עובד החודש</span>
                <span class="meow-bubble" aria-hidden="true">מיאו!</span>
            </button>
        </header>
        <div class="kitchen-line">
            <div class="open-sign" id="connectionStatus"><span class="bulb" aria-hidden="true"></span><span id="connectionText">מדליקים את המכונה</span></div>
        </div>


        <main>
            <section class="menu" aria-labelledby="menuHead">
                <div class="section-head">
                    <div><h2 id="menuHead">מה שותים?</h2><p class="section-note">הקפה שלך, בדיוק בדרך שלך.</p></div><span class="menu-label" lang="en">Made with love.</span>
                </div>

                <div class="menu-grid">
                    <button class="drink drink--hero" type="button" data-kind="house" data-product="הפוך הבית" data-icon="./assets/drinks/house.webp">
                        <span class="drink-flag">הכי בית שיש</span>
                        <span class="product-art"><img src="assets/drinks/house.webp" alt="" width="320" height="320" fetchpriority="high" decoding="async"></span>
                        <span class="product-copy"><h3>הפוך הבית</h3><span class="product-note">קצף רך, קפה עמוק</span></span>
                        <span class="product-add" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg></span>
                    </button>
                    <button class="drink" type="button" data-kind="espresso" data-product="אספרסו" data-icon="./assets/drinks/espresso.webp">

                        <span class="product-art"><img src="assets/drinks/espresso.webp" alt="" width="320" height="320" fetchpriority="high" decoding="async"></span>
                        <span class="product-copy"><h3>אספרסו</h3><span class="product-note">קצר. חזק. מדויק.</span></span>
                        <span class="product-add" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg></span>
                    </button>
                    <button class="drink" type="button" data-kind="macchiato" data-product="שקדיאטו" data-icon="./assets/drinks/macchiato.webp">

                        <span class="product-art"><img src="assets/drinks/macchiato.webp" alt="" width="320" height="320" loading="lazy" decoding="async"></span>
                        <span class="product-copy"><h3>שקדיאטו</h3><span class="product-note">עם הטאץ׳ השקדי</span></span>
                        <span class="product-add" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg></span>
                    </button>
                    <button class="drink" type="button" data-kind="americano" data-product="אמריקנו" data-icon="./assets/drinks/americano.webp">

                        <span class="product-art"><img src="assets/drinks/americano.webp" alt="" width="320" height="320" loading="lazy" decoding="async"></span>
                        <span class="product-copy"><h3>אמריקנו</h3><span class="product-note">אספרסו ומים חמים</span></span>
                        <span class="product-add" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg></span>
                    </button>
                    <button class="drink" type="button" data-kind="flatwhite" data-product="פלאט וויט" data-icon="./assets/drinks/flatwhite.webp">

                        <span class="product-art"><img src="assets/drinks/flatwhite.webp" alt="" width="320" height="320" loading="lazy" decoding="async"></span>
                        <span class="product-copy"><h3>פלאט וויט</h3><span class="product-note">קפה וחלב קטיפתי</span></span>
                        <span class="product-add" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg></span>
                    </button>
                    <button class="drink" type="button" data-kind="latte" data-product="לאטה" data-icon="./assets/drinks/latte.webp">

                        <span class="product-art"><img src="assets/drinks/latte.webp" alt="" width="320" height="320" loading="lazy" decoding="async"></span>
                        <span class="product-copy"><h3>לאטה</h3><span class="product-note">רך, חלבי ומפנק</span></span>
                        <span class="product-add" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg></span>
                    </button>
                    <button class="drink" type="button" data-kind="tea" data-product="תה" data-icon="./assets/drinks/tea.webp">

                        <span class="product-art"><img src="assets/drinks/tea.webp" alt="" width="320" height="320" loading="lazy" decoding="async"></span>
                        <span class="product-copy"><h3>תה</h3><span class="product-note">רגע של שקט בכוס</span></span>
                        <span class="product-add" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg></span>
                    </button>
                    <button class="drink" type="button" data-kind="other" data-product="אחר" data-icon="./assets/drinks/other.webp">

                        <span class="product-art"><img src="assets/drinks/other.webp" alt="" width="320" height="320" loading="lazy" decoding="async"></span>
                        <span class="product-copy"><h3>אחר</h3><span class="product-note">בדיוק כמו שבא לך</span></span>
                        <span class="product-add" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg></span>
                    </button>
                </div>
            </section>


        </main>

        <p class="colophon">מטבח קטן, שאיפות גדולות.</p>
    </div>

    <div class="order-backdrop" id="orderBackdrop" hidden></div>
    <form class="sheet" id="orderForm" autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="sheetName" inert>
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-body">
            <div class="sheet-drink">
                <button class="sheet-close" type="button" id="sheetClose" aria-label="סגור"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
                <div class="sheet-art" id="sheetArt"><img id="sheetIcon" alt="" width="240" height="240"></div>
                <div class="sheet-product-copy"><span class="sheet-eyebrow">בחירה מעולה</span><strong id="sheetName"></strong><p id="sheetDescription"></p></div>
                <button type="button" class="sheet-change" id="changeDrink">החלפת משקה</button>
            </div>
            <div class="field" id="nameField">
                <label for="customerName">מי שותה?</label>
                <input type="text" id="customerName" aria-describedby="nameError" aria-required="true" placeholder="השם שלך" enterkeyhint="next">
                <span class="field-error" id="nameError" role="alert" hidden></span>
            </div>

            <div class="field" id="noteField">
                <label for="specialRequest">משהו מיוחד? <span id="noteHint"></span></label>
                <input type="text" id="specialRequest" aria-describedby="noteError noteHint" placeholder="חלב שקדים, בלי סוכר, בלי לשפוך" enterkeyhint="send">
                <span class="field-error" id="noteError" role="alert" hidden></span>
            </div>

            <button class="send" type="submit" id="submitBtn">
                <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h12v9a6 6 0 0 1-12 0V5Zm12 2h2a3 3 0 0 1 0 6h-2M3 21h15"/></svg>
                <span id="submitLabel">שלח לבריסטה</span>
            </button>
        </div>
    </form>

    <nav class="app-dock" aria-label="ניווט ראשי">
        <a href="#menuHead" class="is-active" id="menuNav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h12v9a6 6 0 0 1-12 0V5Zm12 2h2a3 3 0 0 1 0 6h-2M3 21h15"/></svg><span>התפריט</span></a>
        <a href="barista.html" target="_blank" rel="noopener" id="queueNav"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 9h6M9 13h6M9 17h3M9 4V2h6v2"/></svg><span>מסך הבריסטה</span><span id="dockCount" hidden></span></a>
    </nav>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="firebase-config.js"></script>
    <script type="module" src="firebase-db.js"></script>
    <script defer src="assets/orders.js"></script>
    <div class="cat-visit" id="catVisit" hidden aria-hidden="true">
        <div class="cat-shade"></div>
        <img class="cat-pounce" id="catPounce" src="assets/drinks/puma-pounce.webp" width="640" height="640" alt="">
        <svg class="cat-scratches" viewBox="0 0 400 600" fill="none" aria-hidden="true">
            <path d="M115 190 Q143 278 276 363"/><path d="M90 219 Q124 311 254 397"/><path d="M69 252 Q106 344 230 430"/>
        </svg>
        <span class="cat-caption">פומה ביקש הפסקת קפה.</span>
    </div>
    <script defer src="assets/glass-app.js"></script>
    <script defer src="assets/cat-visit.js"></script>
</body>
</html>
