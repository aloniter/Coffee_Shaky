<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Coffee Shaky ☕</title>
    <meta name="description" content="בית הקפה המשפחתי שלנו. בוחרים משקה, כותבים שם, והקפה בדרך.">
    <meta name="theme-color" content="#f6ecd9">

    <link rel="icon" type="image/png" href="appicon.png">
    <link rel="apple-touch-icon" href="appicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Suez+One&display=swap" rel="stylesheet">

    <style>
        /* ---------------------------------------------------------------
           Coffee Shaky - a small family cafe

           Surfaces: warm cream page, near-white cards, light wood for
           recessed blocks. Espresso brown carries all the type and does the
           contrast work, rather than covering the interface.

           Two accents with fixed jobs, never swapped:
             green   = go / actionable  (selected drink, send, ready orders)
             caramel = warm highlight    (house drink, the usual, details)

           Radius rule: containers 20px, recessed blocks 12px, anything
           interactive is a full pill.
        --------------------------------------------------------------- */
        :root {
            --page: #f6ecd9;
            --page-warm: #f1e2c9;
            --card: #fffdf8;
            --card-sunk: #f4e8d4;
            --wood: #e6cda8;
            --wood-deep: #d4b489;
            --hair: #e5d3b4;

            --ink: #3a2317;
            --ink-mid: #715440;
            /* Measured, not guessed: #a08670 gave 2.7:1 on cream and #856450
               still only 4.1:1. This clears AA for 10px captions. */
            --ink-soft: #77563f;

            /* Olive-shifted off a limey #86b45c so the green sits inside the
               warm palette instead of glowing out of it. */
            --green: #8aad60;
            --green-deep: #62853d;
            /* --green-deep is a border/ledge colour and only reaches 3.8:1 as
               text on cream, so small green type uses this darker one. */
            --green-text: #4d6a2c;
            --green-ink: #1e2a10;
            --green-wash: #eef3e3;

            --caramel: #d98b41;
            /* Darkened from #b96c28 to clear AA on --caramel-wash. */
            --caramel-deep: #8d4d10;
            --caramel-wash: #fbeedc;
            --caramel-soft: #eab97e;

            --brick: #c0553c;

            --r-card: 20px;
            --r-block: 12px;

            /* Shadows tinted with the page hue. No black on cream. */
            --sh-rest: 0 1px 2px rgba(120, 82, 45, .1), 0 6px 14px -6px rgba(120, 82, 45, .22);
            --sh-lift: 0 2px 4px rgba(120, 82, 45, .12), 0 16px 30px -10px rgba(120, 82, 45, .3);

            --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
            --ease-out: cubic-bezier(.16, 1, .3, 1);

            --font-ui: 'Rubik', 'Assistant', 'Heebo', 'Arial Hebrew', system-ui, sans-serif;
            --font-sign: 'Suez One', 'Rubik', 'Arial Hebrew', Georgia, serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Author display rules would otherwise beat the UA [hidden] rule. */
        [hidden] { display: none !important; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-ui);
            background: var(--page);
            color: var(--ink);
            min-height: 100dvh;
            direction: rtl;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* coffee-bg.jpeg blurred almost to nothing: enough to give the cream a
           paper grain, not enough to read as a photo of beans. Multiply on a
           light page darkens hard, so this sits far lower than it would on a
           dark one. */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url('coffee-bg.jpeg');
            background-size: 190px;
            mix-blend-mode: multiply;
            opacity: .05;
            filter: saturate(.16) brightness(1.9) blur(5px);
        }

        .shell {
            position: relative;
            z-index: 1;
            max-width: 720px;
            margin: 0 auto;
            padding: 0 15px calc(30px + env(safe-area-inset-bottom));
        }

        /* ---------------- awning ---------------- */

        /* A striped awning hem across the very top. Reads as "cafe" in one
           glance. Kept short and low contrast on purpose: at full caramel and
           15px it read as a circus tent rather than a shopfront. */
        .awning {
            position: relative;
            height: 8px;
            margin: 0 -15px;
            background: repeating-linear-gradient(90deg,
                var(--caramel-soft) 0 15px, #fdf7ea 15px 30px);
        }

        .awning::after {
            content: '';
            position: absolute;
            top: 100%;
            right: 0;
            left: 0;
            height: 6px;
            background:
                radial-gradient(circle 7.5px at 7.5px 0, var(--caramel-soft) 7.4px, rgba(0, 0, 0, 0) 7.8px) 0 0 / 30px 6px repeat-x,
                radial-gradient(circle 7.5px at 22.5px 0, #fdf7ea 7.4px, rgba(0, 0, 0, 0) 7.8px) 0 0 / 30px 6px repeat-x;
            filter: drop-shadow(0 2px 3px rgba(120, 82, 45, .16));
        }

        /* ---------------- header ---------------- */

        .counter {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            /* Top padding is headroom for the jumping polaroid, which is a lot
               taller than a round avatar and otherwise clips off-screen. */
            padding: 38px 4px 22px;
        }

        .wordmark { flex: 1; min-width: 0; padding-top: 4px; }

        .wordmark h1 {
            font-family: var(--font-sign);
            font-size: clamp(2rem, 8.6vw, 2.6rem);
            line-height: 1;
            letter-spacing: -.02em;
            color: var(--ink);
        }

        /* Brush underline that fades out, like a sign painted by hand. Thin,
           so it underlines the wordmark instead of competing with it. */
        .wordmark h1::after {
            content: '';
            display: block;
            width: 2.4em;
            height: 4px;
            margin-top: 7px;
            border-radius: 999px;
            background: linear-gradient(-90deg, var(--caramel), rgba(217, 139, 65, 0));
        }

        .tagline {
            margin-top: 9px;
            font-size: .84rem;
            font-weight: 500;
            line-height: 1.4;
            color: var(--ink-mid);
            text-wrap: balance;
        }

        /* ---------------- employee of the month ---------------- */

        /* A crooked polaroid taped to the wall, not an avatar chip. */
        .staff {
            flex: 0 0 auto;
            width: 96px;
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: transform .28s var(--ease-spring);
        }

        .staff-frame {
            position: relative;
            width: 84px;
            padding: 6px 6px 22px;
            background: var(--card);
            border-radius: 4px;
            box-shadow: var(--sh-rest);
            transform: rotate(-3.5deg);
            transform-origin: 50% 90%;
            transition: transform .28s var(--ease-spring), box-shadow .28s var(--ease-out);
        }

        /* A strip of tape holding the photo up. */
        .staff-frame::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            width: 34px;
            height: 15px;
            transform: translateX(-50%) rotate(2deg);
            background: rgba(230, 205, 168, .8);
            border: 1px solid rgba(180, 145, 105, .28);
            border-radius: 2px;
        }

        .staff img {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            object-position: 50% 20%;
            border-radius: 2px;
            background: var(--card-sunk);
        }

        @media (hover: hover) {
            .staff:hover .staff-frame {
                transform: rotate(0deg) scale(1.04);
                box-shadow: var(--sh-lift);
            }
        }

        .staff:active .staff-frame { transform: rotate(0deg) scale(.96); }

        .staff-frame.puma-jump { animation: pumaJump 950ms cubic-bezier(.2, .8, .25, 1.2); }

        /* Startled, not launched: the polaroid is ~112px tall, so a big hop
           plus a 1.3 scale threw it clean off the top of the screen. The comedy
           is in the swing, which costs no vertical room. */
        @keyframes pumaJump {
            0%   { transform: rotate(-3.5deg) translateY(0) scale(1); }
            16%  { transform: rotate(7deg) translateY(-7px) scale(1.06); }
            40%  { transform: rotate(-13deg) translateY(-14px) scale(1.12); }
            60%  { transform: rotate(10deg) translateY(-4px) scale(1.07); }
            78%  { transform: rotate(-7deg) translateY(4px) scale(.97); }
            90%  { transform: rotate(2deg) translateY(1px) scale(1.01); }
            100% { transform: rotate(-3.5deg) translateY(0) scale(1); }
        }

        .staff-crown {
            position: absolute;
            top: -4px;
            left: 50%;
            font-size: 1.1rem;
            opacity: 0;
            transform: translate(-50%, 8px) scale(.5);
            pointer-events: none;
        }

        .staff.meowing .staff-crown { animation: crownPop 950ms var(--ease-spring); }

        @keyframes crownPop {
            0%   { opacity: 0; transform: translate(-50%, 8px) scale(.5) rotate(0deg); }
            34%  { opacity: 1; transform: translate(-50%, -21px) scale(1.18) rotate(-13deg); }
            70%  { opacity: 1; transform: translate(-50%, -25px) scale(1) rotate(11deg); }
            100% { opacity: 0; transform: translate(-50%, -33px) scale(.9) rotate(0deg); }
        }

        /* The nudge to press it. Small and dry, so it reads as an aside. */
        .staff-tag {
            margin-top: 9px;
            font-size: .6rem;
            font-weight: 600;
            line-height: 1.3;
            text-align: center;
            text-wrap: balance;
            color: var(--ink-soft);
            transform: rotate(-1.5deg);
        }

        /* Opens inward: the polaroid sits in the far corner of the header. */
        /* Sits beside the photo, below the wordmark's cap height, so the meow
           never covers the brand. */
        .meow-bubble {
            position: absolute;
            top: 44px;
            left: 100%;
            z-index: 3;
            margin-left: 4px;
            padding: 7px 14px;
            border-radius: 999px;
            background: var(--ink);
            color: var(--card);
            font-family: var(--font-sign);
            font-size: 1rem;
            white-space: nowrap;
            box-shadow: var(--sh-lift);
            pointer-events: none;
            opacity: 0;
            transform: scale(.4);
            transform-origin: 0 60%;
        }

        .staff.meowing .meow-bubble { animation: meowPop 1000ms var(--ease-spring); }

        @keyframes meowPop {
            0%   { opacity: 0; transform: scale(.4) rotate(0deg); }
            18%  { opacity: 1; transform: scale(1.12) rotate(-5deg); }
            58%  { opacity: 1; transform: scale(1) rotate(2deg); }
            100% { opacity: 0; transform: scale(.95) rotate(0deg) translateY(-10px); }
        }

        /* ---------------- open sign ---------------- */

        /* Lives inside the wordmark column so the header has no dead gap under
           the polaroid caption. */
        .open-sign {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin: 13px 0 0;
            padding: 6px 13px 6px 11px;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 600;
            background: var(--card);
            border: 1px solid var(--hair);
            color: var(--ink-mid);
            box-shadow: var(--sh-rest);
            transition: color .25s, border-color .25s;
        }

        .open-sign .bulb {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .open-sign.is-open { color: var(--green-text); border-color: rgba(138, 173, 96, .55); }
        .open-sign.is-open .bulb { animation: bulbPulse 2.6s ease-out infinite; }

        @keyframes bulbPulse {
            0%   { box-shadow: 0 0 0 0 rgba(98, 133, 61, .55); }
            70%  { box-shadow: 0 0 0 8px rgba(98, 133, 61, 0); }
            100% { box-shadow: 0 0 0 0 rgba(98, 133, 61, 0); }
        }

        .open-sign.is-shut { color: var(--brick); border-color: rgba(192, 85, 60, .45); }

        /* ---------------- sections ---------------- */

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 4px 13px;
        }

        .section-head h2 {
            font-family: var(--font-sign);
            font-size: 1.45rem;
            font-weight: 400;
            line-height: 1.15;
            color: var(--ink);
        }

        .section-head .count {
            font-family: var(--font-ui);
            font-size: .95rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--ink-soft);
        }

        section + section { margin-top: 28px; }

        /* ---------------- the usual ---------------- */

        .usual {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            max-width: 100%;
            min-height: 44px;
            padding: 6px 8px 6px 15px;
            border: 1.5px solid var(--caramel);
            border-radius: 999px;
            background: var(--caramel-wash);
            color: var(--caramel-deep);
            font-family: inherit;
            font-size: .8rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform .2s var(--ease-spring), background .2s;
        }

        .usual:active { transform: scale(.95); }
        .usual:hover { background: #f7e2c6; }
        .usual img { width: 26px; height: 26px; object-fit: contain; }
        .usual span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ---------------- drink picker ---------------- */

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 11px;
        }

        .drink {
            position: relative;
            display: flex;
            align-items: center;
            gap: 11px;
            min-height: 82px;
            padding: 13px 15px;
            border: 1.5px solid var(--hair);
            border-radius: var(--r-card);
            background: var(--card);
            color: var(--ink);
            font-family: inherit;
            text-align: right;
            cursor: pointer;
            box-shadow: var(--sh-rest);
            overflow: hidden;
            transition: transform .18s var(--ease-spring), box-shadow .2s var(--ease-out),
                        border-color .2s, background .2s;
        }

        .drink > h3,
        .drink > span { flex: 1; min-width: 0; }

        .drink:active { transform: scale(.955); }

        @media (hover: hover) {
            .drink:hover {
                transform: translateY(-3px);
                box-shadow: var(--sh-lift);
                border-color: var(--wood-deep);
            }
            .drink:hover img { transform: scale(1.1) rotate(-4deg); }
        }

        .drink:focus-visible { outline: 3px solid var(--green-deep); outline-offset: 3px; }

        .drink img {
            width: 46px;
            height: 46px;
            flex: 0 0 auto;
            object-fit: contain;
            transition: transform .25s var(--ease-spring);
        }

        .drink h3 {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -.01em;
        }

        /* House drink takes the whole first row: 7 drinks fill 7 cells with no
           orphan tile. row-reverse anchors the cup in the far corner so the
           extra width reads as a sign, not a void. */
        .drink--hero {
            grid-column: 1 / -1;
            flex-direction: row-reverse;
            justify-content: space-between;
            min-height: 104px;
            padding: 15px 20px;
            background: linear-gradient(145deg, var(--card) 0%, var(--card-sunk) 100%);
        }

        .drink--hero > span { flex: 0 1 auto; }
        .drink--hero img { width: 70px; height: 70px; }

        .drink--hero h3 {
            font-family: var(--font-sign);
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: -.02em;
        }

        /* A coffee ring somebody left on the counter. Warm brown and mostly
           cropped by the card edge, so it reads as a stain rather than a
           stray grey circle floating in the middle. */
        .drink--hero::before {
            content: '';
            position: absolute;
            bottom: -52px;
            left: 14%;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 5px solid rgba(160, 96, 40, .07);
            pointer-events: none;
        }

        .drink-flag {
            display: inline-block;
            margin-top: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            background: var(--caramel);
            color: var(--ink);
            font-size: .67rem;
            font-weight: 700;
        }

        .drink.is-picked {
            background: var(--green);
            border-color: var(--green-deep);
            color: var(--green-ink);
            box-shadow: 0 1px 2px rgba(98, 133, 61, .2), 0 12px 24px -8px rgba(98, 133, 61, .55);
        }

        /* Selected keeps the illustration in full colour and marks the card
           instead of bleaching the artwork into a silhouette. */
        .drink.is-picked .drink-flag { background: var(--green-ink); color: var(--green); }
        .drink.is-picked::before { border-color: rgba(31, 46, 13, .1); }

        .drink.is-picked::after {
            content: '✓';
            position: absolute;
            top: 8px;
            left: 10px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--green-ink);
            color: var(--green);
            font-size: .78rem;
            font-weight: 700;
            display: grid;
            place-items: center;
            animation: tickIn .3s var(--ease-spring);
        }

        @keyframes tickIn {
            from { opacity: 0; transform: scale(.3); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* ---------------- order sheet ---------------- */

        .sheet {
            position: fixed;
            z-index: 60;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 13px 15px calc(15px + env(safe-area-inset-bottom));
            background: var(--card);
            border-top: 1.5px solid var(--hair);
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -14px 40px rgba(120, 82, 45, .28);
            transform: translateY(105%);
            transition: transform .34s var(--ease-out);
        }

        .sheet.is-up { transform: translateY(0); }

        .sheet-body {
            max-width: 690px;
            margin: 0 auto;
            display: grid;
            gap: 10px;
        }

        .sheet-drink {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1.5px dashed var(--hair);
        }

        .sheet-drink img { width: 40px; height: 40px; object-fit: contain; }

        .sheet-drink strong {
            flex: 1;
            min-width: 0;
            font-family: var(--font-sign);
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--ink);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sheet-swap {
            flex: 0 0 auto;
            min-height: 44px;
            padding: 0 16px;
            border: 1.5px solid var(--hair);
            border-radius: 999px;
            background: transparent;
            color: var(--ink-mid);
            font-family: inherit;
            font-size: .8rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .18s var(--ease-spring), border-color .2s, color .2s;
        }

        .sheet-swap:active { transform: scale(.94); }
        .sheet-swap:hover { border-color: var(--ink-mid); color: var(--ink); }

        .field { display: grid; gap: 5px; }

        .field label {
            font-size: .78rem;
            font-weight: 600;
            color: var(--ink-mid);
        }

        .field input {
            width: 100%;
            min-height: 50px;
            padding: 12px 15px;
            border: 1.5px solid var(--hair);
            border-radius: var(--r-block);
            background: var(--page);
            color: var(--ink);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }

        .field input::placeholder { color: var(--ink-soft); }

        .field input:focus {
            outline: none;
            background: #fff;
            border-color: var(--green-deep);
            box-shadow: 0 0 0 3px rgba(138, 173, 96, .34);
        }

        .field.has-error input { border-color: var(--brick); animation: nudge .34s ease; }
        .field.has-error input:focus { box-shadow: 0 0 0 3px rgba(192, 85, 60, .28); }

        .field-error { font-size: .76rem; font-weight: 600; color: var(--brick); }

        @keyframes nudge {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .send {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            width: 100%;
            min-height: 58px;
            margin-top: 3px;
            padding: 0 22px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(180deg, #96b96e 0%, var(--green) 100%);
            color: var(--green-ink);
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -.01em;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--green-deep), 0 12px 22px -6px rgba(98, 133, 61, .55);
            transition: transform .16s var(--ease-spring), box-shadow .16s var(--ease-out);
        }

        .send .cup { font-size: 1.15em; }

        /* Physical push: the button drops onto its own ledge. */
        .send:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--green-deep), 0 5px 12px -6px rgba(98, 133, 61, .5);
        }

        .send:disabled {
            background: var(--card-sunk);
            color: var(--ink-soft);
            box-shadow: 0 4px 0 var(--hair);
            cursor: progress;
        }

        .send:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

        /* ---------------- queue ---------------- */

        .queue-columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
            align-items: start;
        }

        .queue-group + .queue-group { margin-top: 18px; }

        .queue-label {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 0 4px 9px;
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .03em;
            color: var(--ink-mid);
        }

        .queue-label .n {
            font-variant-numeric: tabular-nums;
            color: var(--ink-soft);
        }

        .queue-group--ready .queue-label { color: var(--green-text); }

        .tickets { display: grid; gap: 10px; }

        .ticket {
            position: relative;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 12px;
            padding: 13px 15px;
            border: 1.5px solid var(--hair);
            border-radius: var(--r-card);
            background: var(--card);
            color: var(--ink);
            box-shadow: var(--sh-rest);
        }

        .ticket.is-new { animation: ticketIn .5s var(--ease-spring); }

        @keyframes ticketIn {
            from { opacity: 0; transform: translateY(-14px) scale(.94); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .ticket-cup {
            position: relative;
            width: 46px;
            height: 46px;
            border-radius: var(--r-block);
            background: var(--wood);
            display: grid;
            place-items: center;
        }

        .ticket-cup img { width: 34px; height: 34px; object-fit: contain; }

        /* Steam only on drinks still being made, so the loop earns itself. */
        .ticket-cup .steam {
            position: absolute;
            top: -7px;
            left: 50%;
            width: 4px;
            height: 11px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(125, 95, 73, .5), rgba(125, 95, 73, 0));
            transform: translateX(-50%);
            animation: steamUp 2.1s ease-in-out infinite;
        }

        .ticket-cup .steam:nth-of-type(2) { margin-left: -8px; animation-delay: .6s; }
        .ticket-cup .steam:nth-of-type(3) { margin-left: 8px; animation-delay: 1.2s; }

        @keyframes steamUp {
            0%   { opacity: 0; transform: translate(-50%, 4px) scaleY(.6); }
            40%  { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -12px) scaleY(1.3); }
        }

        .ticket-top { display: flex; align-items: baseline; gap: 9px; }

        .ticket-drink {
            flex: 1;
            min-width: 0;
            font-size: 1.04rem;
            font-weight: 600;
            line-height: 1.25;
            letter-spacing: -.01em;
        }

        .ticket-time {
            flex: 0 0 auto;
            font-size: .76rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--ink-soft);
        }

        .ticket-who {
            margin-top: 2px;
            font-size: .92rem;
            font-weight: 500;
            color: var(--ink-mid);
        }

        .ticket-note {
            margin-top: 7px;
            padding: 7px 11px;
            border-radius: 10px;
            background: var(--card-sunk);
            font-size: .86rem;
            line-height: 1.4;
            color: var(--ink);
        }

        .ticket-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 11px;
        }

        .act {
            min-height: 44px;
            padding: 0 18px;
            border: 0;
            border-radius: 999px;
            background: var(--ink);
            color: var(--card);
            font-family: inherit;
            font-size: .88rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .18s var(--ease-spring), background .2s;
        }

        .act:active { transform: scale(.94); }
        .act:hover { background: #4d3020; }

        .act--go {
            background: var(--green);
            color: var(--green-ink);
            box-shadow: 0 3px 0 var(--green-deep);
        }

        .act--go:active { transform: translateY(3px); box-shadow: 0 0 0 var(--green-deep); }
        .act--go:hover { background: #96b96e; }

        .act--kill {
            min-width: 44px;
            padding: 0 12px;
            margin-inline-start: auto;
            background: transparent;
            color: var(--ink-soft);
            font-size: 1rem;
        }

        .act--kill:hover { background: rgba(192, 85, 60, .12); color: var(--brick); }

        /* Ready tickets are filled, not merely recoloured. */
        .ticket--ready {
            background: linear-gradient(150deg, #a3c47a 0%, var(--green) 100%);
            border-color: var(--green-deep);
            color: var(--green-ink);
            box-shadow: 0 1px 2px rgba(98, 133, 61, .2), 0 14px 28px -10px rgba(98, 133, 61, .5);
        }

        .ticket--ready .ticket-cup { background: rgba(31, 46, 13, .14); }
        .ticket--ready .ticket-time,
        .ticket--ready .ticket-who { color: rgba(31, 46, 13, .72); }
        .ticket--ready .ticket-note { background: rgba(255, 255, 255, .55); color: var(--green-ink); }
        /* Espresso, not near-black green: keeps the pill inside the warm
           palette while staying the loudest thing on a ready ticket. */
        .ticket--ready .act { background: var(--ink); color: var(--card); }
        .ticket--ready .act:hover { background: #4d3020; }
        .ticket--ready .act--kill { background: transparent; color: rgba(31, 46, 13, .5); }
        .ticket--ready .act--kill:hover { background: rgba(31, 46, 13, .13); color: var(--green-ink); }

        .ticket--ready .ticket-drink::after {
            content: '☕';
            margin-inline-start: 7px;
            display: inline-block;
            animation: readyWiggle 2.6s var(--ease-out) infinite;
        }

        @keyframes readyWiggle {
            0%, 70%, 100% { transform: rotate(0deg); }
            78% { transform: rotate(-16deg) scale(1.12); }
            88% { transform: rotate(12deg) scale(1.08); }
        }

        .ticket.just-ready { animation: ticketFlip .62s var(--ease-spring); }

        @keyframes ticketFlip {
            0%   { transform: scale(1) rotate(0deg); }
            35%  { transform: scale(1.05) rotate(-1.4deg); }
            65%  { transform: scale(1.02) rotate(1deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* ---------------- empty state ---------------- */

        .empty {
            padding: 30px 22px;
            border: 2px dashed var(--wood-deep);
            border-radius: var(--r-card);
            background: rgba(255, 253, 248, .55);
            text-align: center;
        }

        .empty .mug {
            font-size: 2.4rem;
            display: block;
            animation: mugSnooze 4s ease-in-out infinite;
        }

        @keyframes mugSnooze {
            0%, 100% { transform: rotate(-7deg); }
            50% { transform: rotate(7deg); }
        }

        .empty h3 {
            margin-top: 10px;
            font-family: var(--font-sign);
            font-size: 1.16rem;
            font-weight: 400;
            color: var(--ink);
        }

        .empty p {
            margin-top: 5px;
            font-size: .89rem;
            line-height: 1.5;
            color: var(--ink-mid);
        }

        /* ---------------- clear queue ---------------- */

        .wipe {
            flex: 0 0 auto;
            min-height: 44px;
            padding: 0 12px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--ink-soft);
            font-family: inherit;
            font-size: .78rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .18s var(--ease-spring), background .2s, color .2s;
        }

        .wipe:active { transform: scale(.94); }
        .wipe:hover { background: rgba(192, 85, 60, .12); color: var(--brick); }

        /* ---------------- footer ---------------- */

        .colophon {
            margin: 26px 4px 0;
            font-size: .74rem;
            font-weight: 500;
            color: var(--ink-soft);
            text-align: center;
        }

        /* ---------------- toast ---------------- */

        .toasts {
            position: fixed;
            z-index: 80;
            top: calc(env(safe-area-inset-top) + 14px);
            right: 12px;
            left: 12px;
            display: grid;
            gap: 8px;
            justify-items: center;
            pointer-events: none;
        }

        .toast {
            max-width: 420px;
            padding: 12px 18px;
            border-radius: 999px;
            font-size: .9rem;
            font-weight: 600;
            text-align: center;
            box-shadow: var(--sh-lift);
            animation: toastIn .34s var(--ease-spring);
        }

        .toast--ok { background: var(--green); color: var(--green-ink); }
        .toast--bad { background: var(--brick); color: #fff2ee; }
        .toast.is-out { animation: toastOut .3s var(--ease-out) forwards; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-16px) scale(.9); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes toastOut {
            to { opacity: 0; transform: translateY(-12px) scale(.96); }
        }

        /* ---------------- order celebration ---------------- */

        .order-celebration {
            position: fixed;
            inset: 0;
            z-index: 90;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
            animation: celebrationOverlay 1.95s ease-out forwards;
        }

        .celebration-wave {
            position: absolute;
            left: -14%;
            bottom: -126%;
            width: 128%;
            height: 236%;
            border-radius: 46% 44% 0 0 / 10% 10% 0 0;
            background:
                radial-gradient(120% 36% at 50% 4%, rgba(255, 240, 213, .3), rgba(255, 240, 213, 0) 58%),
                linear-gradient(180deg, #b07443 0%, #8a5730 44%, #613a1f 100%);
            box-shadow: inset 0 16px 28px rgba(255, 233, 194, .2), inset 0 -40px 88px rgba(60, 32, 14, .4);
            transform: translate3d(0, 108%, 0);
            will-change: transform;
            animation: coffeeRise 1.5s cubic-bezier(.24, .84, .24, 1) forwards;
        }

        .coffee-surface {
            position: absolute;
            top: 4%;
            left: -8%;
            width: 116%;
            height: 150px;
            background:
                radial-gradient(95% 120% at 50% 100%, rgba(255, 245, 222, .36) 0 26%, rgba(255, 245, 222, 0) 64%),
                repeating-radial-gradient(circle at 8% 110%, rgba(255, 240, 205, .27) 0 22px, rgba(255, 240, 205, .02) 22px 52px);
            filter: blur(1px);
            animation: coffeeSurfaceDrift 1.25s ease-in-out infinite;
        }

        .celebration-badge {
            position: absolute;
            top: calc(env(safe-area-inset-top) + 15%);
            left: 50%;
            z-index: 2;
            max-width: calc(100vw - 32px);
            padding: 13px 24px;
            border-radius: 999px;
            background: var(--card);
            color: var(--ink);
            font-family: var(--font-sign);
            font-size: clamp(1rem, 4.4vw, 1.28rem);
            line-height: 1.25;
            text-align: center;
            box-shadow: 0 14px 34px rgba(60, 32, 14, .4);
            transform: translate(-50%, 22px) scale(.86);
            opacity: 0;
            animation: coffeeBadge 1.7s var(--ease-spring) forwards;
        }

        .celebration-particle {
            position: absolute;
            left: var(--x, 50%);
            bottom: calc(env(safe-area-inset-bottom) + 6%);
            z-index: 1;
            width: var(--size, 12px);
            height: var(--size, 12px);
            border-radius: 999px;
            background: radial-gradient(circle at 34% 34%, rgba(255, 255, 255, .95), rgba(255, 255, 255, .3) 40%, rgba(255, 226, 178, .05) 68%, rgba(255, 226, 178, 0) 76%);
            border: 1px solid rgba(255, 248, 232, .34);
            opacity: 0;
            transform: translate3d(0, 0, 0) scale(.46);
            animation: coffeeBubble var(--duration, 1.2s) ease-out forwards;
            animation-delay: var(--delay, 0s);
            will-change: transform, opacity;
        }

        @keyframes celebrationOverlay {
            0% { opacity: 0; } 8% { opacity: 1; } 84% { opacity: 1; } 100% { opacity: 0; }
        }

        @keyframes coffeeRise {
            0% { transform: translate3d(0, 108%, 0); }
            55% { transform: translate3d(0, 17%, 0); }
            78% { transform: translate3d(0, -6%, 0); }
            100% { transform: translate3d(0, 0, 0); }
        }

        @keyframes coffeeSurfaceDrift {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-7%); }
        }

        @keyframes coffeeBadge {
            0%   { opacity: 0; transform: translate(-50%, 22px) scale(.86); }
            25%  { opacity: 1; transform: translate(-50%, -3px) scale(1.04); }
            70%  { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -18px) scale(.95); }
        }

        @keyframes coffeeBubble {
            0%   { opacity: 0; transform: translate3d(0, 0, 0) scale(.46); }
            18%  { opacity: .82; }
            100% { opacity: 0; transform: translate3d(var(--drift, 0px), var(--rise, -56vh), 0) scale(1); }
        }

        /* Burst on the ticket that just became ready. */
        .pop-layer { position: absolute; inset: 0; overflow: visible; pointer-events: none; }

        .pop {
            position: absolute;
            top: 50%;
            right: 30px;
            width: 9px;
            height: 9px;
            border-radius: 2px;
            background: var(--c, #fff);
            opacity: 0;
            animation: popOut .9s cubic-bezier(.25, .7, .35, 1) forwards;
            animation-delay: var(--d, 0s);
        }

        /* Opacity is keyframed with explicit holds. Under a single 0 -> 1 fade
           the front-loaded curve dropped the confetti to 3% opacity less than
           halfway through, so the burst was never actually visible. */
        @keyframes popOut {
            0%   { opacity: 0; transform: translate(0, 0) scale(.5) rotate(0deg); }
            12%  { opacity: 1; }
            65%  { opacity: 1; }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); }
        }

        /* ---------------- desktop ---------------- */

        @media (min-width: 700px) {
            .menu-grid { grid-template-columns: repeat(3, 1fr); }

            /* Wide and shallow reads as a counter sign; wide and tall reads as
               an empty box. */
            .drink--hero { min-height: 98px; padding: 13px 28px; }
            .drink--hero img { width: 74px; height: 74px; }
            .drink--hero h3 { font-size: 1.7rem; }

            .queue-group + .queue-group { margin-top: 0; }

            .sheet {
                right: auto;
                left: 50%;
                bottom: 18px;
                width: min(540px, calc(100vw - 40px));
                border: 1.5px solid var(--hair);
                border-radius: var(--r-card);
                transform: translate(-50%, calc(100% + 28px));
                box-shadow: 0 22px 50px rgba(120, 82, 45, .32);
            }

            .sheet.is-up { transform: translate(-50%, 0); }
        }

        @media (max-width: 370px) {
            .staff { width: 82px; }
            .staff-frame { width: 72px; padding: 5px 5px 18px; }
            .drink { min-height: 76px; padding: 11px 12px; gap: 9px; }
            .drink img { width: 40px; height: 40px; }
            .drink h3 { font-size: .93rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="awning" aria-hidden="true"></div>

    <div class="shell">
        <header class="counter">
            <div class="wordmark">
                <h1>Coffee Shaky</h1>
                <p class="tagline">הקפה הכי טוב ברדיוס של ארבעה מטרים.</p>

                <div class="open-sign" id="connectionStatus">
                    <span class="bulb" aria-hidden="true"></span>
                    <span id="connectionText">מדליקים את המכונה</span>
                </div>
            </div>

            <button class="staff" id="employeeBanner" type="button"
                    aria-label="תלחצו על עובד החודש שיעבוד מהר יותר">
                <span class="staff-frame">
                    <img id="employeeImage" src="employee.jpg" alt="עובדת החודש">
                </span>
                <span class="staff-crown" aria-hidden="true">👑</span>
                <span class="staff-tag">תלחצו על עובד החודש שיעבוד מהר יותר</span>
                <span class="meow-bubble" aria-hidden="true">מיאו!</span>
            </button>
        </header>

        <main>
            <section class="menu" aria-labelledby="menuHead">
                <div class="section-head">
                    <h2 id="menuHead">מה שותים?</h2>
                    <button class="usual" id="usualBtn" type="button" hidden>
                        <img id="usualIcon" alt="">
                        <span id="usualLabel"></span>
                    </button>
                </div>

                <div class="menu-grid">
                    <button class="drink drink--hero" type="button" data-product="הפוך הבית" data-icon="./cappuccinoIcon.png">
                        <img src="./cappuccinoIcon.png" alt="">
                        <span>
                            <h3>הפוך הבית</h3>
                            <span class="drink-flag">הכי מוזמן בבית</span>
                        </span>
                    </button>

                    <button class="drink" type="button" data-product="אספרסו" data-icon="./espresso.png">
                        <img src="./espresso.png" alt="">
                        <h3>אספרסו</h3>
                    </button>

                    <button class="drink" type="button" data-product="שקדיאטו" data-icon="./macchiatoIcon.png">
                        <img src="./macchiatoIcon.png" alt="">
                        <h3>שקדיאטו</h3>
                    </button>

                    <button class="drink" type="button" data-product="אמריקנו" data-icon="./americanoIcon.png">
                        <img src="./americanoIcon.png" alt="">
                        <h3>אמריקנו</h3>
                    </button>

                    <button class="drink" type="button" data-product="קפה יובל" data-icon="./flatWhiteIcon.svg">
                        <img src="./flatWhiteIcon.svg" alt="">
                        <h3>קפה יובל</h3>
                    </button>

                    <button class="drink" type="button" data-product="תה" data-icon="./teaIcon.png">
                        <img src="./teaIcon.png" alt="">
                        <h3>תה</h3>
                    </button>

                    <button class="drink" type="button" data-product="אחר" data-icon="./otherIcon.png">
                        <img src="./otherIcon.png" alt="">
                        <h3>אחר</h3>
                    </button>
                </div>
            </section>

            <section class="queue" aria-labelledby="queueHead">
                <div class="section-head">
                    <h2 id="queueHead">התור <span class="count" id="queueCount"></span></h2>
                    <button class="wipe" type="button" onclick="clearAllOrders()">נקה את התור</button>
                </div>
                <div id="ordersContainer"></div>
            </section>
        </main>

        <p class="colophon">מטבח קטן, שאיפות גדולות.</p>
    </div>

    <form class="sheet" id="orderForm" autocomplete="off">
        <div class="sheet-body">
            <div class="sheet-drink">
                <img id="sheetIcon" alt="">
                <strong id="sheetName"></strong>
                <button class="sheet-swap" type="button" id="sheetSwap">שנה</button>
            </div>

            <div class="field" id="nameField">
                <label for="customerName">מי שותה?</label>
                <input type="text" id="customerName" placeholder="השם שלך" enterkeyhint="next">
                <span class="field-error" id="nameError" hidden></span>
            </div>

            <div class="field" id="noteField">
                <label for="specialRequest">משהו מיוחד? <span id="noteHint"></span></label>
                <input type="text" id="specialRequest" placeholder="חלב שקדים, בלי סוכר, בלי לשפוך" enterkeyhint="send">
                <span class="field-error" id="noteError" hidden></span>
            </div>

            <button class="send" type="submit" id="submitBtn">
                <span class="cup" aria-hidden="true">☕</span>
                <span id="submitLabel">שלח לבריסטה</span>
            </button>
        </div>
    </form>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="firebase-config.js"></script>
    <script type="module" src="firebase-db.js"></script>
    <script>
        function debugLog(message, data = null) {
            console.log(`[Coffee Shaky] ${message}`, data ?? '');
        }

        let orders = [];
        let selectedProduct = null;
        let selectedIcon = null;
        let unsubscribeOrders = null;

        const MEOW_SOUND_FILE = 'מיאו.wav';
        const NAME_KEY = 'coffeeShaky.name';
        const USUAL_KEY = 'coffeeShaky.usual';

        let catMeowAudio = null;
        let pumaResetTimeout = null;
        let orderCelebrationTimeout = null;

        // Realtime bookkeeping: Firestore re-delivers the whole list on every
        // change, so remember what we have already shown to tell a genuinely
        // new ticket apart from a re-render, and to catch preparing -> ready.
        const seenOrderIds = new Set();
        const knownStatuses = new Map();
        let firstRenderDone = false;

        const EMPTY_LINES = [
            { title: 'התור ריק.', body: 'הבריסטה גולל ברשתות. זה הזמן לנצל את זה.' },
            { title: 'אף אחד לא רוצה קפה?', body: 'מצב חשוד. בדרך כלל יש כאן תור.' },
            { title: 'שקט תעשייתי במטבח.', body: 'המכונה חמה, החלב במקרר, קדימה.' }
        ];
        const emptyLine = EMPTY_LINES[Math.floor(Math.random() * EMPTY_LINES.length)];

        document.addEventListener('DOMContentLoaded', function () {
            initializeApp();
        });

        function initializeApp() {
            try {
                setupMenuSelection();
                setupOrderSheet();
                setupEmployeeOfTheMonth();
                restoreUsual();
                renderOrders();

                if (!window.CoffeeDB) {
                    throw new Error('firebase-db.js did not load');
                }
                if (window.CoffeeDB.initError) {
                    throw window.CoffeeDB.initError;
                }

                startOrdersStream();
                debugLog('ready');
            } catch (error) {
                debugLog('init failed', error);
                showToast('המכונה לא מתניעה: ' + error.message, 'bad', 7000);
                updateConnectionStatus(false);
            }
        }

        /* ---------------- drink picking ---------------- */

        function setupMenuSelection() {
            document.querySelectorAll('.drink').forEach(item => {
                // The name lives in an <h3> next to an alt="" illustration, so
                // label the button itself rather than relying on subtree text.
                item.setAttribute('aria-label', item.dataset.product);
                item.setAttribute('aria-pressed', 'false');

                item.addEventListener('click', () => {
                    pickDrink(item.dataset.product, item.dataset.icon);
                });
            });
        }

        function pickDrink(product, icon, options = {}) {
            selectedProduct = product;
            selectedIcon = icon;

            document.querySelectorAll('.drink').forEach(el => {
                const isPicked = el.dataset.product === product;
                el.classList.toggle('is-picked', isPicked);
                el.setAttribute('aria-pressed', isPicked ? 'true' : 'false');
            });

            document.getElementById('sheetIcon').src = icon;
            document.getElementById('sheetName').textContent = product;

            // "אחר" has no fixed recipe, so the note carries the whole order.
            const isOther = product === 'אחר';
            document.getElementById('noteHint').textContent = isOther ? '(חובה כאן)' : '(לא חייב)';
            document.getElementById('specialRequest').placeholder = isOther
                ? 'מה בדיוק להכין?'
                : 'חלב שקדים, בלי סוכר, בלי לשפוך';

            clearFieldError('nameField', 'nameError');
            clearFieldError('noteField', 'noteError');

            openSheet();

            if (options.silentFocus) return;

            const nameInput = document.getElementById('customerName');
            if (isOther) {
                document.getElementById('specialRequest').focus();
            } else if (!nameInput.value.trim()) {
                nameInput.focus();
            }
        }

        function openSheet() {
            const sheet = document.getElementById('orderForm');
            sheet.classList.add('is-up');
            // Keep the queue reachable above the raised sheet.
            requestAnimationFrame(() => {
                document.querySelector('.shell').style.paddingBottom = (sheet.offsetHeight + 26) + 'px';
            });
        }

        function closeSheet() {
            document.getElementById('orderForm').classList.remove('is-up');
            document.querySelector('.shell').style.paddingBottom = '';
        }

        function setupOrderSheet() {
            document.getElementById('orderForm').addEventListener('submit', event => {
                event.preventDefault();
                submitOrder();
            });

            document.getElementById('sheetSwap').addEventListener('click', () => {
                cancelOrder();
                document.querySelector('.menu').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            const savedName = localStorage.getItem(NAME_KEY);
            if (savedName) {
                document.getElementById('customerName').value = savedName;
            }

            document.getElementById('customerName').addEventListener('input', () => {
                clearFieldError('nameField', 'nameError');
            });
            document.getElementById('specialRequest').addEventListener('input', () => {
                clearFieldError('noteField', 'noteError');
            });

            document.getElementById('usualBtn').addEventListener('click', repeatUsual);
        }

        /* ---------------- the usual (one tap reorder) ---------------- */

        function restoreUsual() {
            let usual = null;
            try {
                usual = JSON.parse(localStorage.getItem(USUAL_KEY) || 'null');
            } catch (error) {
                usual = null;
            }

            if (!usual || !usual.product) return;

            const card = document.querySelector(`.drink[data-product="${cssEscape(usual.product)}"]`);
            if (!card) return;

            document.getElementById('usualIcon').src = card.dataset.icon;
            document.getElementById('usualLabel').textContent = 'עוד ' + usual.product + '?';
            document.getElementById('usualBtn').hidden = false;
        }

        function rememberUsual(product, customerName, specialRequest) {
            try {
                localStorage.setItem(NAME_KEY, customerName);
                localStorage.setItem(USUAL_KEY, JSON.stringify({ product, specialRequest }));
            } catch (error) {
                debugLog('could not save the usual', error);
            }
            restoreUsual();
        }

        // One tap: refills the exact previous order and raises the sheet.
        function repeatUsual() {
            let usual = null;
            try {
                usual = JSON.parse(localStorage.getItem(USUAL_KEY) || 'null');
            } catch (error) {
                return;
            }
            if (!usual) return;

            const card = document.querySelector(`.drink[data-product="${cssEscape(usual.product)}"]`);
            if (!card) return;

            pickDrink(usual.product, card.dataset.icon, { silentFocus: true });
            document.getElementById('specialRequest').value = usual.specialRequest || '';
            document.getElementById('customerName').value = localStorage.getItem(NAME_KEY) || '';
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function cssEscape(value) {
            return String(value).replace(/["\\]/g, '\\$&');
        }

        /* ---------------- employee of the month ---------------- */

        function setupEmployeeOfTheMonth() {
            const employeeBanner = document.getElementById('employeeBanner');
            const employeeImage = document.getElementById('employeeImage');

            if (!employeeBanner || !employeeImage) return;

            // The polaroid frame is what jumps, so the photo, its border and
            // the tape travel together instead of the photo leaving the frame.
            const employeeFrame = employeeBanner.querySelector('.staff-frame');
            const originalEmployeeSrc = employeeImage.getAttribute('src');
            const originalEmployeeAlt = employeeImage.getAttribute('alt');
            let originalImageFailed = false;

            // Preload the puma photo so the click-time src swap comes from cache.
            // Without this it can still be in flight when the animation ends and
            // we swap back, which aborts the load and fires 'error' on the <img>.
            const pumaPreload = new Image();
            pumaPreload.src = 'puma.jpeg';

            // Only a broken original portrait should hide the photo. An aborted
            // puma load must never leave the element permanently invisible.
            employeeImage.addEventListener('error', () => {
                if (employeeImage.getAttribute('src') !== originalEmployeeSrc) return;
                originalImageFailed = true;
                employeeImage.style.visibility = 'hidden';
            });

            const restoreEmployeeImage = () => {
                employeeFrame.classList.remove('puma-jump');
                employeeImage.src = originalEmployeeSrc;
                employeeImage.alt = originalEmployeeAlt;
                employeeImage.style.visibility = originalImageFailed ? 'hidden' : '';
            };

            const triggerPumaJump = () => {
                if (pumaResetTimeout) {
                    clearTimeout(pumaResetTimeout);
                    pumaResetTimeout = null;
                }

                employeeImage.src = 'puma.jpeg';
                employeeImage.alt = 'פומה, עובד החודש בפועל';

                employeeFrame.classList.remove('puma-jump');
                employeeBanner.classList.remove('meowing');

                // Force reflow so the animation restarts on every tap.
                void employeeFrame.offsetWidth;

                employeeFrame.classList.add('puma-jump');
                employeeBanner.classList.add('meowing');
                playCatMeow();

                if (navigator.vibrate) navigator.vibrate(18);

                employeeFrame.addEventListener('animationend', () => {
                    restoreEmployeeImage();
                    if (pumaResetTimeout) {
                        clearTimeout(pumaResetTimeout);
                        pumaResetTimeout = null;
                    }
                }, { once: true });

                // Listen on the bubble itself: animationend bubbles, so a listener
                // on the button would also catch the frame's jump animation.
                const meowBubble = employeeBanner.querySelector('.meow-bubble');
                if (meowBubble) {
                    meowBubble.addEventListener('animationend', () => {
                        employeeBanner.classList.remove('meowing');
                    }, { once: true });
                }

                // Fallback in case animationend does not fire.
                pumaResetTimeout = setTimeout(() => {
                    restoreEmployeeImage();
                    employeeBanner.classList.remove('meowing');
                    pumaResetTimeout = null;
                }, 1150);
            };

            employeeBanner.addEventListener('click', triggerPumaJump);
        }

        function playCatMeow() {
            try {
                if (!catMeowAudio) {
                    catMeowAudio = new Audio(MEOW_SOUND_FILE);
                    catMeowAudio.preload = 'auto';
                }

                catMeowAudio.pause();
                catMeowAudio.currentTime = 0;
                const playPromise = catMeowAudio.play();

                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(error => {
                        debugLog('could not play the meow', error);
                        speakMeowFallback();
                    });
                }
            } catch (error) {
                debugLog('could not init the meow', error);
                speakMeowFallback();
            }
        }

        function speakMeowFallback() {
            if (!('speechSynthesis' in window)) return;

            const utterance = new SpeechSynthesisUtterance('מיאו');
            utterance.lang = 'he-IL';
            utterance.pitch = 1.8;
            utterance.rate = 0.95;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        /* ---------------- realtime stream ---------------- */

        // Single live listener: Firestore re-delivers the whole ordered list on
        // every change and handles reconnection itself, so there is no separate
        // load step and no manual retry loop.
        function startOrdersStream() {
            if (unsubscribeOrders) {
                unsubscribeOrders();
            }

            unsubscribeOrders = window.CoffeeDB.subscribeToOrders(
                liveOrders => {
                    orders = liveOrders;
                    renderOrders();
                },
                (connected, error) => {
                    updateConnectionStatus(connected);
                    if (error) {
                        debugLog('live orders error', error);
                        showToast('נפל החיבור למטבח: ' + error.message, 'bad', 6000);
                    }
                }
            );
        }

        function updateConnectionStatus(connected) {
            const sign = document.getElementById('connectionStatus');
            const text = document.getElementById('connectionText');

            sign.classList.toggle('is-open', connected);
            sign.classList.toggle('is-shut', !connected);
            text.textContent = connected ? 'פתוח · המכונה חמה' : 'אין קשר עם המטבח';
        }

        /* ---------------- ordering ---------------- */

        async function submitOrder() {
            const nameInput = document.getElementById('customerName');
            const noteInput = document.getElementById('specialRequest');
            const submitBtn = document.getElementById('submitBtn');
            const submitLabel = document.getElementById('submitLabel');

            const customerName = nameInput.value.trim();
            const specialRequest = noteInput.value.trim();

            if (!selectedProduct) {
                showToast('קודם בוחרים משקה', 'bad');
                return;
            }

            if (!customerName) {
                setFieldError('nameField', 'nameError', 'בלי שם הקפה יתקרר על הדלפק.');
                nameInput.focus();
                return;
            }

            if (selectedProduct === 'אחר' && !specialRequest) {
                setFieldError('noteField', 'noteError', '"אחר" זה לא הזמנה. מה להכין?');
                noteInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitLabel.textContent = 'רץ למטבח...';

            try {
                const orderedProduct = selectedProduct;

                // Firestore queues writes locally and resolves only once the
                // server acknowledges, so with no connection this never settles.
                // The order is safely stored and will send by itself, but say so
                // instead of leaving the button spinning forever.
                let acknowledged = false;
                const queuedNotice = setTimeout(() => {
                    if (acknowledged) return;
                    cancelOrder();
                    showToast('אין חיבור. ההזמנה שמורה ותישלח כשהרשת תחזור.', 'bad', 7000);
                    submitBtn.disabled = false;
                    submitLabel.textContent = 'שלח לבריסטה';
                }, 8000);

                try {
                    await window.CoffeeDB.createOrder({
                        productName: orderedProduct,
                        customerName: customerName,
                        specialRequest: specialRequest
                    });
                } finally {
                    acknowledged = true;
                    clearTimeout(queuedNotice);
                }

                rememberUsual(orderedProduct, customerName, specialRequest);
                cancelOrder();
                showOrderCelebration(orderedProduct);

            } catch (error) {
                debugLog('order failed', error);
                showToast('ההזמנה לא עברה: ' + error.message, 'bad', 6000);
            } finally {
                submitBtn.disabled = false;
                submitLabel.textContent = 'שלח לבריסטה';
            }
        }

        // Keeps the remembered name on purpose: in a family of five you should
        // never type your own name twice.
        function cancelOrder() {
            closeSheet();
            document.getElementById('specialRequest').value = '';
            selectedProduct = null;
            selectedIcon = null;

            document.querySelectorAll('.drink').forEach(item => {
                item.classList.remove('is-picked');
                item.setAttribute('aria-pressed', 'false');
            });
        }

        async function updateOrderStatus(orderId, newStatus) {
            try {
                await window.CoffeeDB.updateOrderStatus(orderId, newStatus);
            } catch (error) {
                debugLog('status update failed', error);
                showToast('לא הצלחתי לעדכן: ' + error.message, 'bad');
            }
        }

        async function completeOrder(orderId) {
            try {
                await window.CoffeeDB.removeOrder(orderId);
                showToast('בתיאבון', 'ok');
            } catch (error) {
                debugLog('complete failed', error);
                showToast('לא הצלחתי לסגור: ' + error.message, 'bad');
            }
        }

        async function deleteOrder(orderId) {
            if (!confirm('לבטל את ההזמנה הזו?')) return;

            try {
                await window.CoffeeDB.removeOrder(orderId);
            } catch (error) {
                debugLog('delete failed', error);
                showToast('לא הצלחתי למחוק: ' + error.message, 'bad');
            }
        }

        async function clearAllOrders() {
            if (!orders.length) {
                showToast('התור כבר ריק', 'ok');
                return;
            }

            if (!confirm('למחוק את כל התור? גם את זה שכבר מוכן.')) return;

            try {
                await window.CoffeeDB.removeAllOrders();
                showToast('הדלפק נוקה', 'ok');
            } catch (error) {
                debugLog('clear all failed', error);
                showToast('לא הצלחתי לנקות: ' + error.message, 'bad');
            }
        }

        /* ---------------- queue rendering ---------------- */

        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            const countEl = document.getElementById('queueCount');

            const preparing = orders.filter(order => order.status === 'preparing');
            const ready = orders.filter(order => order.status === 'ready');

            countEl.textContent = orders.length ? orders.length : '';

            if (!orders.length) {
                container.innerHTML = `
                    <div class="empty">
                        <span class="mug" aria-hidden="true">☕</span>
                        <h3>${escapeHtml(emptyLine.title)}</h3>
                        <p>${escapeHtml(emptyLine.body)}</p>
                    </div>
                `;
                knownStatuses.clear();
                firstRenderDone = true;
                return;
            }

            // Ready first: those are the ones somebody has to walk over and take.
            const groups = [
                { key: 'ready', label: 'מוכן לאיסוף', list: ready },
                { key: 'preparing', label: 'בהכנה', list: preparing }
            ].filter(group => group.list.length);

            const justReady = [];

            const html = groups.map(group => `
                <div class="queue-group queue-group--${group.key}">
                    <div class="queue-label">${escapeHtml(group.label)} <span class="n">${group.list.length}</span></div>
                    <div class="tickets">
                        ${group.list.map(order => renderTicket(order, justReady)).join('')}
                    </div>
                </div>
            `).join('');

            container.innerHTML = `<div class="queue-columns">${html}</div>`;

            orders.forEach(order => {
                seenOrderIds.add(order.id);
                knownStatuses.set(order.id, order.status);
            });

            // Forget ids that left the queue so a re-used id can animate again.
            const liveIds = new Set(orders.map(order => order.id));
            [...knownStatuses.keys()].forEach(id => {
                if (!liveIds.has(id)) {
                    knownStatuses.delete(id);
                    seenOrderIds.delete(id);
                }
            });

            justReady.forEach(id => burstOnTicket(id));
            firstRenderDone = true;
        }

        function renderTicket(order, justReady) {
            const timeString = order.created_at.toLocaleTimeString('he-IL', {
                hour: '2-digit',
                minute: '2-digit'
            });

            const isReady = order.status === 'ready';
            const isNew = firstRenderDone && !seenOrderIds.has(order.id);
            const turnedReady = firstRenderDone && isReady && knownStatuses.get(order.id) === 'preparing';

            if (turnedReady) justReady.push(order.id);

            const classes = ['ticket'];
            if (isReady) classes.push('ticket--ready');
            if (isNew) classes.push('is-new');
            if (turnedReady) classes.push('just-ready');

            const safeId = escapeHtml(order.id);
            const icon = iconForProduct(order.product_name);

            const action = isReady
                ? `<button class="act" type="button" onclick="completeOrder('${safeId}')">נאסף</button>`
                : `<button class="act act--go" type="button" onclick="updateOrderStatus('${safeId}', 'ready')">מוכן!</button>`;

            const steam = isReady ? '' : `
                <span class="steam" aria-hidden="true"></span>
                <span class="steam" aria-hidden="true"></span>
                <span class="steam" aria-hidden="true"></span>`;

            return `
                <article class="${classes.join(' ')}" data-order-id="${safeId}">
                    <div class="ticket-cup">
                        ${steam}
                        <img src="${escapeHtml(icon)}" alt="">
                    </div>
                    <div>
                        <div class="ticket-top">
                            <h3 class="ticket-drink">${escapeHtml(order.product_name)}</h3>
                            <span class="ticket-time">${escapeHtml(timeString)}</span>
                        </div>
                        <p class="ticket-who">${escapeHtml(order.customer_name)}</p>
                        ${order.special_request ? `<p class="ticket-note">${escapeHtml(order.special_request)}</p>` : ''}
                        <div class="ticket-actions">
                            ${action}
                            <button class="act act--kill" type="button" title="בטל הזמנה"
                                    aria-label="בטל הזמנה" onclick="deleteOrder('${safeId}')">✕</button>
                        </div>
                    </div>
                </article>
            `;
        }

        function iconForProduct(productName) {
            const card = document.querySelector(`.drink[data-product="${cssEscape(productName)}"]`);
            return card ? card.dataset.icon : './otherIcon.png';
        }

        /* ---------------- feedback ---------------- */

        function showToast(message, kind = 'ok', life = 3600) {
            const toast = document.createElement('div');
            toast.className = `toast toast--${kind === 'bad' ? 'bad' : 'ok'}`;
            toast.textContent = message;
            document.getElementById('toasts').appendChild(toast);

            setTimeout(() => {
                toast.classList.add('is-out');
                setTimeout(() => toast.remove(), 320);
            }, life);
        }

        // Tiny burst on the ticket that just flipped to ready. Fires on every
        // family phone watching the queue, which is the point.
        function burstOnTicket(orderId) {
            const ticket = document.querySelector(`.ticket[data-order-id="${cssEscape(orderId)}"]`);
            if (!ticket) return;

            const layer = document.createElement('div');
            layer.className = 'pop-layer';
            layer.setAttribute('aria-hidden', 'true');

            const colors = ['#fffdf8', '#d98b41', '#62853d', '#c0553c'];

            for (let i = 0; i < 10; i++) {
                const bit = document.createElement('span');
                bit.className = 'pop';
                const angle = (Math.PI / 10) * i + Math.PI * 0.6;
                bit.style.setProperty('--dx', `${Math.cos(angle) * (48 + (i % 3) * 20)}px`);
                bit.style.setProperty('--dy', `${-Math.abs(Math.sin(angle)) * (40 + (i % 4) * 18)}px`);
                bit.style.setProperty('--rot', `${(i % 2 ? 1 : -1) * (120 + i * 22)}deg`);
                bit.style.setProperty('--c', colors[i % colors.length]);
                bit.style.setProperty('--d', `${i * 0.024}s`);
                layer.appendChild(bit);
            }

            ticket.appendChild(layer);
            setTimeout(() => layer.remove(), 1100);
        }

        function setFieldError(fieldId, errorId, message) {
            const field = document.getElementById(fieldId);
            const error = document.getElementById(errorId);
            field.classList.remove('has-error');
            void field.offsetWidth;
            field.classList.add('has-error');
            error.textContent = message;
            error.hidden = false;
        }

        function clearFieldError(fieldId, errorId) {
            document.getElementById(fieldId).classList.remove('has-error');
            const error = document.getElementById(errorId);
            error.hidden = true;
            error.textContent = '';
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function showOrderCelebration(productName) {
            const previous = document.getElementById('orderCelebration');
            if (previous) previous.remove();

            if (orderCelebrationTimeout) {
                clearTimeout(orderCelebrationTimeout);
                orderCelebrationTimeout = null;
            }

            const celebration = document.createElement('div');
            celebration.id = 'orderCelebration';
            celebration.className = 'order-celebration';
            celebration.setAttribute('aria-hidden', 'true');

            const flood = document.createElement('div');
            flood.className = 'celebration-wave';

            const surface = document.createElement('div');
            surface.className = 'coffee-surface';
            flood.appendChild(surface);
            celebration.appendChild(flood);

            const badge = document.createElement('div');
            badge.className = 'celebration-badge';
            badge.textContent = productName ? `${productName} נכנס לתור` : 'ההזמנה נכנסה לתור';
            celebration.appendChild(badge);

            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            const particleCount = isMobile ? 10 : 14;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('span');
                particle.className = 'celebration-particle';
                const baseX = 7 + (86 / Math.max(1, particleCount - 1)) * i;
                const xOffset = i % 2 === 0 ? 1.8 : -1.8;
                const size = (isMobile ? 7 : 9) + (i % 4) * 2;
                const drift = (i % 2 === 0 ? -1 : 1) * (8 + (i % 3) * 7);
                const rise = -(isMobile ? 45 : 56) - (i % 5) * 7;
                const duration = (isMobile ? 1.02 : 1.2) + (i % 3) * 0.12;

                particle.style.setProperty('--x', `${Math.max(4, Math.min(96, baseX + xOffset))}%`);
                particle.style.setProperty('--size', `${size}px`);
                particle.style.setProperty('--drift', `${drift}px`);
                particle.style.setProperty('--rise', `${rise}vh`);
                particle.style.setProperty('--duration', `${duration}s`);
                particle.style.setProperty('--delay', `${0.08 + i * 0.045}s`);
                celebration.appendChild(particle);
            }

            document.body.appendChild(celebration);

            orderCelebrationTimeout = setTimeout(() => {
                celebration.remove();
                orderCelebrationTimeout = null;
            }, 2000);
        }
    </script>
</body>
</html>
